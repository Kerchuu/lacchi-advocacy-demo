:root {
  --paper: #f7f3e9;
  --surface: #fffcf5;
  --ink: #29241f;
  --muted: #655c52;
  --line: #c6bcae;
  --accent: #8d3827;
  --on-accent: #fffaf0;
  --wash: #eee5d7;
  --display: Instrument, Georgia, serif;
  --sans: DM, Arial, sans-serif;
  --mono: Consolas, "Courier New", monospace;
  --edge: clamp(20px, 4.5vw, 78px);
  --max: 1460px;
  --focus: #186089;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
[data-edition="blueprint"] {
  --paper: #edf3fa;
  --surface: #fafdff;
  --ink: #142d58;
  --muted: #435d7b;
  --line: #a2b8cf;
  --wash: #dbe8f5;
  --accent: #184f9f;
  --on-accent: #fff;
  --focus: #9d4308;
  --display: DM, Arial, sans-serif;
}
[data-edition="garden"] {
  --paper: #f3f4e9;
  --surface: #fffff5;
  --ink: #26392c;
  --muted: #526451;
  --line: #aeb9a0;
  --wash: #e3e9d7;
  --accent: #3b5c34;
  --on-accent: #fffef4;
  --focus: #6948a2;
}
[data-edition="parade"] {
  --paper: #fff2dd;
  --surface: #fffaf0;
  --ink: #392328;
  --muted: #73544f;
  --line: #c9a89c;
  --wash: #f7e2c8;
  --accent: #943246;
  --on-accent: #fffaf1;
}
* {
  box-sizing: border-box;
}
html {
  min-height: 100%;
  scroll-behavior: auto;
}
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.52 var(--sans);
  margin: 0;
  min-width: 280px;
}
a {
  color: inherit;
  text-underline-offset: 0.22em;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button {
  background: none;
}
button,
a,
input,
textarea,
select,
summary {
  touch-action: manipulation;
}
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
#main:focus-visible {
  outline: 1px solid transparent;
  box-shadow: inset 0 3px var(--focus);
}
[hidden] {
  display: none !important;
}
.sr-only,
.skip:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
.skip:focus {
  position: fixed;
  left: 12px;
  top: 12px;
  background: var(--surface);
  color: var(--ink);
  padding: 12px;
  z-index: 100;
}
.masthead,
.edition-rail,
.foot {
  border-color: var(--line);
  border-style: solid;
  border-width: 0 0 1px;
}
.mast-inner,
.edition-inner,
.foot,
.page,
.cover,
.cover-foot,
.guide-page,
.source-page {
  width: min(100%, var(--max));
  padding-inline: var(--edge);
  margin-inline: auto;
}
.mast-inner,
.edition-inner,
.mast-inner nav,
.foot,
.foot > div,
.foot nav,
.wordmark,
.actions {
  display: flex;
  align-items: center;
}
.mast-inner {
  min-height: 80px;
  gap: clamp(15px, 3vw, 55px);
}
.wordmark {
  min-height: 44px;
  font:
    400 34px/0.92 Instrument,
    Georgia,
    serif;
  letter-spacing: -0.038em;
  text-decoration: none;
  gap: 11px;
  white-space: nowrap;
}
.brand-mark {
  display: inline-flex;
  position: relative;
  align-items: center;
  gap: 2px;
  width: 30px;
  height: 31px;
  color: var(--accent);
}
.brand-mark i {
  height: 23px;
  width: 7px;
  background: currentColor;
  transform: skewY(-24deg);
}
.brand-mark i:nth-child(2) {
  height: 32px;
}
.brand-mark i:nth-child(3) {
  height: 19px;
  align-self: flex-end;
}
.mast-inner nav {
  gap: clamp(15px, 2.3vw, 38px);
}
.nav {
  margin-left: auto;
}
.mast-inner a:not(.wordmark) {
  font-size: 14px;
  font-weight: 650;
  text-decoration: none;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  position: relative;
}
.mast-inner a[aria-current="page"]::after,
.mast-inner nav a:hover::after {
  content: "";
  position: absolute;
  bottom: 5px;
  left: 0;
  right: 0;
  background: var(--accent);
  height: 2px;
}
.resources {
  border-left: 1px solid var(--line);
  padding-left: clamp(16px, 2.7vw, 40px);
}
.edition-rail {
  background: var(--wash);
}
.edition-inner {
  min-height: 53px;
  gap: 20px;
}
.edition-label,
.byline,
.eyebrow,
.little-label,
.figure-label {
  font: 600 11px/1.4 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.edition-label,
.byline {
  color: var(--muted);
}
.byline {
  margin-left: auto;
  font-size: 10px;
}
.edition-inner #editions {
  display: flex;
  align-items: center;
  gap: 4px;
}
.edition-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 11px;
  min-height: 38px;
  border: 1px solid transparent;
  color: var(--ink);
  font-size: 13px;
  font-weight: 580;
}
.edition-button:hover {
  background: var(--paper);
}
.edition-button[aria-pressed="true"] {
  background: var(--surface);
  border-color: var(--line);
  border-radius: 3px;
}
.swatch {
  width: 11px;
  height: 11px;
  background: var(--chip);
  border: 1px solid #0003;
}
.swatch.blueprint {
  background: repeating-linear-gradient(90deg, #1b5399 0 3px, #c9e9ff 3px 4px);
}
.swatch.garden {
  border-radius: 7px 1px;
  background: #647849;
}
.swatch.parade {
  background: linear-gradient(135deg, #a1364b 0 50%, #f4be75 50%);
}
#edition-select {
  display: none;
}
#main {
  min-height: 57vh;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1,
h2,
h3 {
  text-wrap: balance;
}
p {
  overflow-wrap: break-word;
}
.page,
.guide-page,
.source-page {
  padding-block: clamp(32px, 5vw, 75px) 64px;
}
.page-head h1,
.section-title,
.guide-page h1,
.source-page h1 {
  font: 400 clamp(46px, 6vw, 84px) / 1 var(--display);
  letter-spacing: -0.035em;
  margin: 8px 0 18px;
}
.eyebrow,
.little-label {
  color: var(--accent);
}
.actions {
  gap: 10px;
  flex-wrap: wrap;
}
.btn,
.button-link {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 11px 20px;
  border: 1px solid var(--line);
  border-radius: 3px;
  text-decoration: none;
  font-size: 15px;
  font-weight: 650;
  line-height: 1.3;
  transition:
    background 0.15s,
    color 0.15s,
    transform 0.13s var(--ease);
}
.btn.primary,
.button-link {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}
.btn.secondary {
  color: var(--ink);
  background: var(--surface);
}
.btn:hover,
.button-link:hover {
  filter: brightness(0.94);
}
.btn:active,
.button-link:active {
  transform: translateY(1px);
}
button:disabled {
  cursor: default;
  opacity: 0.66;
}
.panel {
  padding: clamp(16px, 2.4vw, 32px);
  border: 1px solid var(--line);
  background: var(--surface);
}
.notice {
  background: var(--wash);
  padding: 12px 16px;
  border-left: 3px solid var(--accent);
}
.field {
  display: grid;
  gap: 5px;
}
.field input,
.field textarea,
.field select {
  max-width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 10px 12px;
}
textarea {
  resize: vertical;
}
summary {
  cursor: pointer;
}
.foot {
  border-width: 1px 0 0;
  min-height: 98px;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
}
.foot > div,
.foot nav {
  gap: 22px;
}
.foot-brand {
  font:
    25px Instrument,
    Georgia,
    serif;
}
.foot > div > span + span {
  color: var(--muted);
}
.foot a,
.foot button {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}
.foot button {
  border: 0;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 0.22em;
}
dialog {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-top: 4px solid var(--accent);
  max-width: min(440px, calc(100% - 32px));
  padding: 28px;
}
dialog::backdrop {
  background: #241d19a6;
}
dialog h2 {
  font: 38px/1 var(--display);
  margin-bottom: 12px;
}
.read-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(230px, 0.7fr);
  gap: 50px;
  align-items: start;
}
.read-grid h2,
.source-page h2 {
  font: 400 clamp(30px, 3vw, 48px) / 1.12 var(--display);
  margin: 18px 0 12px;
}
.read-grid details {
  border-top: 1px solid var(--line);
  padding: 14px 0;
}
.read-grid summary {
  font-weight: 650;
  min-height: 38px;
  align-content: center;
}
.read-grid details p {
  margin: 6px 0 8px;
  max-width: 64ch;
}
.text-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 18px;
}
.source-picker {
  display: grid;
  gap: 5px;
  margin-bottom: 18px;
}
.source-picker select {
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  width: 100%;
  max-width: 36em;
}
.code-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.code-top h2 {
  font: 600 16px var(--mono);
  overflow-wrap: anywhere;
}
.code-viewport {
  color: #f4f0dd;
  background: #252924;
  padding: clamp(12px, 2.4vw, 28px);
  max-height: 65vh;
  overflow: auto;
  tab-size: 2;
  font: 13px/1.65 var(--mono);
  border: 1px solid #393e36;
}
.code-viewport.wrap {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.read-intro {
  max-width: 62ch;
  color: var(--muted);
}
.resource-actions button {
  min-height: 44px;
}
@media (max-width: 940px) {
  .byline {
    display: none;
  }
  .mast-inner {
    gap: 15px;
  }
  .wordmark {
    font-size: 29px;
  }
  .mast-inner nav {
    gap: 14px;
  }
  .resources {
    padding-left: 15px;
  }
  .edition-inner {
    gap: 12px;
  }
  .edition-button {
    padding-inline: 9px;
  }
}
@media (max-width: 740px) {
  .mast-inner {
    flex-wrap: wrap;
    justify-content: space-between;
    column-gap: 8px;
    row-gap: 0;
    padding-top: 15px;
  }
  .wordmark {
    font-size: 30px;
  }
  .resources {
    order: 1;
    border: 0;
    padding-left: 0;
  }
  .nav {
    order: 2;
    margin: 0;
    width: 100%;
  }
  .mast-inner .nav {
    gap: 24px;
  }
  .mast-inner a:not(.wordmark) {
    font-size: 13px;
  }
  .edition-inner {
    min-height: 49px;
    justify-content: space-between;
  }
  .edition-inner #editions {
    display: none;
  }
  #edition-select {
    display: block;
    min-height: 44px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 5px 12px;
    max-width: 62%;
    font-size: 14px;
  }
  .read-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .foot {
    flex-wrap: wrap;
    padding-block: 16px;
  }
  .foot nav,
  .foot > div {
    gap: 15px;
  }
  .code-top {
    display: grid;
  }
  .btn {
    min-height: 46px;
  }
  .edition-label {
    font-size: 10px;
  }
}
@media (max-width: 370px) {
  :root {
    --edge: 16px;
  }
  .wordmark {
    font-size: 25px;
    gap: 7px;
  }
  .brand-mark {
    transform: scale(0.85);
    transform-origin: left center;
    width: 24px;
  }
  .mast-inner nav {
    gap: 10px;
  }
  .foot > div {
    flex-wrap: wrap;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

.cover {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.06fr);
  align-items: center;
  gap: clamp(26px, 4.6vw, 90px);
  padding-block: clamp(38px, 5.1vw, 78px) clamp(40px, 5.2vw, 80px);
  min-height: min(740px, calc(92svh - 133px));
}
.cover-copy {
  min-width: 0;
  max-width: 650px;
}
.issue-line,
.cover-note {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.issue-line {
  color: var(--accent);
  text-transform: uppercase;
  font: 600 11px/1.5 var(--mono);
  letter-spacing: 0.09em;
  margin: 0 0 clamp(20px, 2.1vw, 34px);
}
.issue-line b {
  color: var(--line);
  font-weight: 400;
}
.issue-dash {
  display: inline-block;
  width: 29px;
  height: 2px;
  background: currentColor;
}
.cover h1 {
  font: 400 clamp(66px, 7.85vw, 126px) / 0.94 var(--display);
  margin: 0;
  letter-spacing: -0.045em;
  color: var(--ink);
  text-wrap: initial;
}
.cover h1 em {
  font-weight: inherit;
  color: var(--accent);
}
.standfirst {
  font-size: clamp(16px, 1.24vw, 20px);
  line-height: 1.55;
  max-width: 38ch;
  margin: clamp(20px, 2.1vw, 32px) 0;
  color: color-mix(in srgb, var(--ink) 42%, var(--muted));
}
.cover-actions,
.desk-link {
  display: flex;
  align-items: center;
}
.cover-actions {
  flex-wrap: wrap;
  gap: 12px 23px;
}
.cover-actions .primary {
  min-height: 52px;
  padding-inline: 21px;
  gap: 22px;
}
.arrow {
  font-size: 1.22em;
  line-height: 1;
}
.desk-link {
  gap: 9px;
  min-height: 44px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 650;
}
.desk-link:hover {
  text-decoration: underline;
}
.desk-link span {
  transition: transform 0.18s var(--ease);
}
.desk-link:hover span {
  transform: translateX(3px);
}
.cover-note {
  font-size: 12px;
  color: var(--muted);
  margin: 24px 0 0;
  gap: 8px;
}
.note-dot {
  width: 7px;
  height: 7px;
  border: 1.5px solid currentColor;
  border-radius: 50%;
}
.exhibit {
  min-width: 0;
}
.cover-foot {
  padding-block: 34px 47px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: minmax(190px, 0.55fr) minmax(0, 2fr);
  gap: 28px;
  align-items: start;
}
.path-heading p {
  margin-bottom: 7px;
}
.path-heading h2 {
  font: 400 clamp(32px, 3.2vw, 46px) / 1 var(--display);
  letter-spacing: -0.035em;
  margin: 0;
}
.path-links {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.path-links a {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 7px;
  padding: 7px 17px 8px 22px;
  border-left: 1px solid var(--line);
  text-decoration: none;
  align-content: start;
}
.path-links a:hover strong {
  text-decoration: underline;
}
.path-links span {
  font: 11px var(--mono);
  color: var(--muted);
  grid-column: 1/-1;
}
.path-links strong {
  font-weight: 620;
  font-size: 16px;
  line-height: 1.35;
}
.path-links i {
  font-style: normal;
  color: var(--accent);
}
.guide-aside {
  background: var(--wash);
  padding: clamp(18px, 2.6vw, 36px);
}
.guide-paths article {
  padding-bottom: 26px;
  margin-bottom: 25px;
  border-bottom: 1px solid var(--line);
}
.guide-paths article p {
  max-width: 60ch;
}
.guide-aside h2:first-child {
  margin-top: 0;
}
.credit-list {
  padding-left: 16px;
}
.credit-list li {
  margin: 0.8em 0;
}
.license-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
  line-height: 1.55;
  max-height: 350px;
  overflow: auto;
}
.storage-banner {
  width: min(100% - 34px, 1100px);
  margin: 16px auto;
  background: var(--wash);
  padding: 10px 14px;
  border: 1px solid var(--line);
  font-weight: 600;
}
[data-edition="blueprint"] .cover h1 {
  font-size: clamp(54px, 5.85vw, 94px);
  letter-spacing: -0.07em;
  font-weight: 720;
  line-height: 1.04;
}
[data-edition="blueprint"] .cover h1 em {
  font-style: normal;
  font-weight: 460;
}
[data-edition="blueprint"] .btn {
  border-radius: 0;
}
[data-edition="blueprint"] .cover-copy {
  padding-left: clamp(12px, 2vw, 36px);
  border-left: 2px solid #98b4cd;
}
.guide-page h1,
.source-page h1 {
  margin-bottom: 18px;
}
[data-edition="garden"] .cover {
  grid-template-columns: minmax(0, 0.96fr) minmax(0, 1.05fr);
}
[data-edition="garden"] .btn.primary {
  border-radius: 22px 4px 22px 4px;
}
[data-edition="garden"] .issue-dash {
  height: 10px;
  width: 19px;
  border-radius: 100% 0;
  background: var(--accent);
}
[data-edition="garden"] .cover h1 {
  letter-spacing: -0.045em;
}
[data-edition="parade"] .cover h1 em {
  text-decoration: underline;
  text-decoration-color: #daa25d;
  text-decoration-thickness: 0.055em;
  text-underline-offset: 0.08em;
  text-decoration-skip-ink: auto;
}
[data-edition="parade"] .cover .primary {
  box-shadow: 3px 3px 0 var(--ink);
  border-color: var(--ink);
}
[data-edition="parade"] .cover .primary:active {
  box-shadow: 1px 1px 0 var(--ink);
}
@media (min-width: 761px) and (prefers-reduced-motion: no-preference) {
  .cover-copy {
    animation: opening 0.32s var(--ease) both;
  }
  @keyframes opening {
    from {
      opacity: 1;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
}
@media (max-width: 950px) {
  .cover {
    gap: 25px;
    grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
  }
  .cover h1 {
    font-size: clamp(62px, 8vw, 82px);
  }
  .cover-note {
    margin-top: 17px;
  }
  .cover-foot {
    grid-template-columns: 1fr;
  }
  .cover-actions {
    gap: 5px 15px;
  }
  .cover-actions .primary {
    min-height: 48px;
  }
  .path-links a:first-child {
    padding-left: 0;
    border: 0;
  }
}
@media (max-width: 740px) {
  .cover,
  [data-edition="garden"] .cover {
    grid-template-columns: 1fr;
    min-height: auto;
    gap: 28px;
    padding-block: 32px 30px;
  }
  .cover-copy {
    max-width: 630px;
  }
  .issue-line {
    margin-bottom: 15px;
    gap: 8px;
    font-size: 10px;
  }
  .cover h1 {
    font-size: clamp(62px, 12.9vw, 100px);
  }
  .standfirst {
    font-size: 16px;
    max-width: 45ch;
    margin: 17px 0;
  }
  .cover-note {
    margin-top: 13px;
  }
  .cover-foot {
    padding-block: 24px 27px;
    gap: 14px;
  }
  .path-links {
    grid-template-columns: 1fr;
  }
  .path-links a,
  .path-links a:first-child {
    grid-template-columns: minmax(85px, 0.5fr) minmax(110px, 1.4fr) auto;
    align-items: center;
    padding: 13px 0;
    border: 0;
    border-top: 1px solid var(--line);
  }
  .path-links span {
    grid-column: auto;
  }
  .path-links strong {
    font-size: 14px;
  }
  [data-edition="blueprint"] .cover h1 {
    font-size: clamp(44px, 9.9vw, 75px);
  }
  .byline {
    display: none;
  }
}
@media (max-width: 370px) {
  .cover-actions .primary {
    padding-inline: 13px;
    gap: 12px;
  }
  .desk-link {
    font-size: 13px;
    gap: 5px;
  }
  .cover-actions {
    column-gap: 12px;
  }
  .cover-note {
    font-size: 11px;
  }
}
.ledger-cell {
  display: grid;
  align-content: start;
  gap: 5px;
  padding: 7px 17px 8px 22px;
  border-left: 1px solid var(--line);
}
.ledger-cell > strong {
  font-weight: 500;
  color: var(--muted);
}
@media (min-width: 1100px) and (min-height: 720px) {
  .cover {
    min-height: clamp(630px, calc(100svh - 135px), 870px);
  }
}
@media (min-width: 741px) and (max-width: 980px) {
  .cover {
    min-height: 0;
    padding-block: 56px;
  }
}
@media (max-width: 950px) {
  .path-links .ledger-cell:first-child {
    padding-left: 0;
    border-left: 0;
  }
}
@media (max-width: 740px) {
  .ledger-cell,
  .path-links .ledger-cell:first-child {
    grid-template-columns: minmax(85px, 0.5fr) minmax(110px, 1.4fr) auto;
    align-items: center;
    padding: 13px 0;
    border: 0;
    border-top: 1px solid var(--line);
    column-gap: 7px;
  }
  .cover-actions {
    column-gap: 12px;
  }
  .cover-actions .primary {
    padding-inline: 14px;
    gap: 12px;
  }
  .cover-actions .desk-link {
    font-size: 13px;
    gap: 6px;
  }
}

/* Each exhibit sets its own materials. The tab strip stays familiar across editions. */
.fx {
  container-type: inline-size;
  min-width: 0;
  color: var(--ink);
}
.fx-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-block: 1px solid var(--line);
}
.fx-label,
.fx-reference,
.fx-tinytag,
.fx-address {
  font: 600 11px/1.35 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.fx-top .fx-label {
  margin: 0;
  color: var(--muted);
  font: 600 10px/1.35 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.fx-tabs {
  display: flex;
  gap: 1px;
}
.fx-tabs button {
  position: relative;
  color: var(--muted);
  border: 0;
  padding: 0 clamp(7px, 2.2cqi, 15px);
  min-height: 44px;
  font: 600 13px/1 var(--sans);
}
.fx-tabs button:last-child {
  padding-right: 2px;
  padding-left: clamp(8px, 2cqi, 14px);
}
.fx-tabs button::after {
  content: "";
  position: absolute;
  right: 6px;
  left: 6px;
  bottom: 0;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 160ms var(--ease);
}
.fx-tabs button:last-child::after {
  right: 0;
}
.fx-tabs button[aria-selected="true"] {
  color: var(--accent);
}
.fx-tabs button[aria-selected="true"]::after,
.fx-tabs button:hover::after {
  transform: scaleX(1);
}
.fx-tabs button:active {
  transform: translateY(1px);
}
.fx-tabs button:focus-visible {
  outline-offset: -3px;
  z-index: 1;
}
.fx-panel {
  position: relative;
}
.fx-panel:focus-visible {
  outline-offset: 3px;
}
.fx-art {
  height: clamp(326px, 75cqi, 510px);
  position: relative;
  isolation: isolate;
  overflow: hidden;
}
.fx-art p,
.fx-art h3,
.fx-art blockquote,
.fx-art dd,
.fx-art dl {
  margin: 0;
}
.fx-reference {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  font-size: clamp(9px, 2.1cqi, 11px);
}
.fx-excerpt {
  font:
    400 clamp(19px, 4.6cqi, 31px) / 1.12 Instrument,
    Georgia,
    serif;
}
.fx-permissions {
  display: grid;
  font: 500 clamp(12px, 2.7cqi, 15px) / 1.4 var(--sans);
}
.fx-permissions div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
  padding: 6px 0;
  border-top: 1px solid currentColor;
}
.fx-permissions dd {
  font-weight: 700;
}
.fx-fieldnote,
.fx-register,
.fx-measured-text {
  animation: fx-page-in 210ms var(--ease) both;
}
@keyframes fx-page-in {
  from {
    opacity: 0.65;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.fx-fieldnote h3 {
  font:
    400 clamp(26px, 6.7cqi, 45px) / 1 Instrument,
    Georgia,
    serif;
  letter-spacing: -0.035em;
  margin: 8px 0 12px;
}
/* The engineering sheet uses proportional columns on one shared dollar scale. */
.fx-drawing {
  color: #f7fbff;
  background-color: #104d89;
  background-image:
    linear-gradient(#b7deff21 1px, transparent 1px),
    linear-gradient(90deg, #b7deff21 1px, transparent 1px);
  background-size: 24px 24px;
  padding: clamp(15px, 4.6cqi, 34px);
}
.fx-plan {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  position: relative;
  border: 1px solid #bedefa;
  padding: clamp(13px, 4.3cqi, 30px);
}
.fx-plan::before,
.fx-plan::after {
  position: absolute;
  content: "+";
  font: 400 23px/0.7 var(--mono);
  background: #104d89;
  color: #e1f3ff;
}
.fx-plan::before {
  left: -8px;
  top: -8px;
}
.fx-plan::after {
  right: -8px;
  bottom: -8px;
}
.fx-tinytag {
  font-size: clamp(9px, 2.2cqi, 12px);
  color: #d7eafa;
}
.fx-plan-head h3 {
  font: 650 clamp(23px, 5.8cqi, 40px) / 1.08 var(--sans);
  letter-spacing: -0.045em;
  margin-top: 3px;
}
.fx-plot {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  padding: clamp(16px, 5.2cqi, 30px) 0 30px;
}
.fx-axis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font: 500 11px/1 var(--mono);
  color: #d5eafb;
}
.fx-columns {
  display: flex;
  align-items: end;
  justify-content: space-evenly;
  gap: 10%;
  padding-inline: 8%;
  position: relative;
  border-bottom: 1px solid #deefff;
  background: repeating-linear-gradient(
    to top,
    #c5e6ff54 0 1px,
    transparent 1px 50%
  );
}
.fx-column {
  display: flex;
  flex-direction: column;
  justify-content: end;
  position: relative;
  width: 32%;
}
.fx-column strong {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  font: 600 clamp(13px, 3.2cqi, 21px) / 1.12 var(--sans);
}
.fx-column small {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  padding-top: 4px;
  font: 500 11px/1 var(--mono);
}
.fx-column i {
  flex: 1;
  min-height: 1px;
}
.fx-previous {
  height: 59.33%;
  border: 1px solid #dbefff;
  background: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    #bedcf5 6px 7px
  );
}
.fx-current {
  height: 95.33%;
  background: #f5ca71;
  color: #fff5ce;
}
.fx-plan-key {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-block-start: 1px solid #b0d2ef;
  padding-top: 7px;
  font: 500 12px/1.2 var(--mono);
}
.fx-plan-key strong {
  font: 650 clamp(17px, 4cqi, 27px) / 1.1 var(--sans);
  color: #ffe1a2;
}
.fx-register,
.fx-measured-text {
  align-self: center;
  padding-block: 10px;
}
.fx-register .fx-permissions {
  margin-top: 8px;
}
.fx-measured-text blockquote {
  font: 500 clamp(18px, 4.4cqi, 30px) / 1.2 var(--sans);
  margin-top: 7px;
  letter-spacing: -0.025em;
}

.fx-fieldnote {
  width: min(78%, 360px);
  position: relative;
  padding: clamp(13px, 3.8cqi, 26px) clamp(14px, 4.8cqi, 32px);
  color: #293e2c;
  background: #f6f3cf;
  box-shadow: 0 4px 12px #1b271f35;
  border-radius: 0 0 12px 0;
}
.fx-fieldnote::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 0;
  bottom: 0;
  border-left: 1px solid #a9b68a;
}
.fx-fieldnote .fx-reference {
  color: #4a6444;
  border-bottom: 1px solid #9fae83;
  padding-bottom: 7px;
}
.fx-fieldnote h3 {
  margin: 9px 0 7px;
}
.fx-note-sum {
  font:
    italic 400 clamp(29px, 7.1cqi, 47px) / 1 Instrument,
    Georgia,
    serif;
}
.fx-note-sum span {
  font: 400 0.58em/1 var(--sans);
  vertical-align: 0.15em;
  color: #587341;
}
.fx-art .fx-note-line {
  font: 500 clamp(11px, 2.6cqi, 15px) / 1.35 var(--sans);
  margin-top: 6px;
}

/* The fold stays below the message. Changing tabs pulls the next sheet into view. */
.fx-post {
  background: #efc48b;
  display: grid;
  place-items: center;
  color: #522635;
}
.fx-envelope {
  position: relative;
  width: 84%;
  height: 81%;
  max-width: 510px;
  isolation: isolate;
}
.fx-back {
  position: absolute;
  inset: 3% 0 0;
  background: #ae5a56;
  clip-path: polygon(0 52%, 50% 0, 100% 52%, 100% 100%, 0 100%);
}
.fx-letter {
  background: #fff3d7;
  position: absolute;
  left: 6%;
  top: 0;
  right: 6%;
  bottom: 12%;
  padding: clamp(12px, 4cqi, 27px);
  color: #522635;
  border-top: 3px solid #a4484d;
  animation: fx-unfold 230ms var(--ease) both;
}
.fx-letter .fx-reference {
  color: #7c3d48;
  margin-bottom: 8px;
}
.fx-letter h3 {
  font:
    400 clamp(32px, 8.5cqi, 61px) / 0.93 Instrument,
    Georgia,
    serif;
  letter-spacing: -0.035em;
}
.fx-letter h3 em {
  color: #95354a;
}
.fx-letter p,
.fx-letter blockquote {
  font: 500 clamp(13px, 3.3cqi, 20px) / 1.28 var(--sans);
  margin-top: 7px;
}
.fx-letter .fx-permissions {
  margin-top: 10px;
}
.fx-post-1 .fx-letter h3,
.fx-post-2 .fx-letter h3 {
  font-size: clamp(25px, 6.4cqi, 44px);
}
.fx-pocket,
.fx-pocket i {
  position: absolute;
  inset: 0;
  clip-path: polygon(0 43%, 50% 70%, 100% 43%, 100% 100%, 0 100%);
  background: #c87869;
  pointer-events: none;
}
.fx-post-1 .fx-pocket {
  --fold-side: 52%;
  --fold-center: 73%;
}
.fx-post-2 .fx-pocket {
  --fold-side: 64%;
  --fold-center: 78%;
}
.fx-post-1 .fx-pocket,
.fx-post-2 .fx-pocket {
  clip-path: polygon(
    0 var(--fold-side),
    50% var(--fold-center),
    100% var(--fold-side),
    100% 100%,
    0 100%
  );
  animation: fx-open-pocket 0.21s var(--ease) both;
}
.fx-pocket i {
  clip-path: polygon(0 100%, 50% 65%, 100% 100%);
  background: #d88e78;
}
.fx-address {
  position: absolute;
  left: 7%;
  bottom: 6.5%;
  display: grid;
  gap: 2px;
  max-width: 65%;
  color: #39212a;
  font-size: clamp(8px, 1.9cqi, 11px);
}
.fx-address b {
  font: 650 clamp(14px, 3.5cqi, 20px) / 1 var(--sans);
  letter-spacing: 0.03em;
}
.fx-postage {
  width: 12%;
  aspect-ratio: 1.18;
  position: absolute;
  right: 6%;
  bottom: 6%;
  background-color: #fbefd1;
  display: grid;
  place-items: center;
  border: 2px dotted #934245;
}
.fx-postage i {
  width: 64%;
  height: 65%;
  background: repeating-linear-gradient(
    to top,
    #953b50 0 2px,
    transparent 2px 4px
  );
  clip-path: polygon(
    0 48%,
    50% 7%,
    100% 48%,
    85% 48%,
    85% 100%,
    15% 100%,
    15% 48%
  );
}
@keyframes fx-unfold {
  from {
    transform: translateY(6px);
    opacity: 0.8;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes fx-open-pocket {
  from {
    clip-path: polygon(0 43%, 50% 70%, 100% 43%, 100% 100%, 0 100%);
  }
  to {
    clip-path: polygon(
      0 var(--fold-side),
      50% var(--fold-center),
      100% var(--fold-side),
      100% 100%,
      0 100%
    );
  }
}
@container (max-width:360px) {
  .fx-fieldnote {
    width: 87%;
  }
  .fx-post-2 .fx-letter .fx-permissions div {
    padding-block: 3px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .fx *,
  .fx *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* Participant forms use the same paper, ink and rule colors as the active edition. */
.folio-page {
  --folio-border: color-mix(in srgb, var(--ink) 48%, var(--paper));
  overflow-wrap: anywhere;
}
.folio-page [hidden] {
  display: none !important;
}
.folio-steps {
  margin-bottom: clamp(1.4rem, 3vw, 2.5rem);
}
.folio-steps ol {
  display: flex;
  list-style: none;
  gap: clamp(0.45rem, 2vw, 1.55rem);
  margin: 0;
  padding: 0;
  align-items: center;
  color: var(--muted);
}
.folio-steps li {
  display: flex;
  align-items: center;
  min-width: 0;
}
.folio-steps li + li::before {
  content: "";
  width: clamp(0.4rem, 2vw, 1.6rem);
  height: 1px;
  background: var(--line);
  margin-right: clamp(0.45rem, 2vw, 1.55rem);
}
.folio-steps li > :is(a, span) {
  display: inline-flex;
  gap: 0.45rem;
  align-items: center;
  font: 650 0.82rem/1.2 var(--sans);
}
.folio-steps a,
.folio-back {
  color: inherit;
  text-underline-offset: 0.2em;
}
.folio-steps a {
  min-height: 44px;
}
.folio-step-number {
  display: grid;
  place-items: center;
  min-width: 1.45rem;
  height: 1.45rem;
  font: 0.76rem/1 var(--mono);
  border: 1px solid var(--folio-border);
  border-radius: 50%;
  flex: 0 0 auto;
}
.folio-steps [aria-current] {
  color: var(--ink);
}
.folio-steps [aria-current] .folio-step-number {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.folio-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.68fr) minmax(242px, 0.78fr);
  gap: 1.6rem clamp(1.5rem, 4vw, 4rem);
  align-items: start;
}
.folio-grid > * {
  min-width: 0;
}
.folio-section-head,
.folio-draft-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.25rem 1.25rem;
  flex-wrap: wrap;
}
.folio-section-head {
  border-top: 2px solid var(--ink);
  margin-bottom: 1.05rem;
  padding-top: 0.85rem;
}
.folio-page
  :is(
    .folio-section-head,
    .folio-support,
    .folio-sheet,
    .folio-note,
    .folio-confirm,
    .folio-draft-row
  )
  h2 {
  font: 600 clamp(1.25rem, 2.3vw, 1.65rem) / 1.2 var(--display);
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0;
}
.folio-text-action {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  padding: 0.3rem 0;
  min-height: 44px;
  font: 650 0.88rem/1.4 var(--sans);
  color: var(--accent);
  border: none;
  background: transparent;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.21em;
  cursor: pointer;
  text-align: left;
}
.folio-text-action:hover {
  text-decoration-thickness: 2px;
}
.folio-pair {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}
.folio-field {
  margin-bottom: 1.15rem;
}
.folio-field label {
  display: block;
  font: 650 0.95rem/1.45 var(--sans);
  margin-bottom: 0.4rem;
  color: var(--ink);
}
.folio-field :is(input, textarea) {
  display: block;
  width: 100%;
  max-width: 100%;
  min-height: 46px;
  padding: 0.72rem 0.8rem;
  font: 1rem/1.45 var(--sans);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--folio-border);
  border-radius: 3px;
}
.folio-field textarea {
  min-height: 10rem;
  resize: vertical;
}
.folio-field [aria-invalid="true"] {
  border: 2px solid var(--ink);
}
.folio-hint,
.folio-field .folio-hint {
  font: 0.85rem/1.55 var(--sans);
  color: var(--muted);
  margin: 0.45rem 0 0;
}
.folio-page .folio-error {
  display: block;
  font: 650 0.88rem/1.5 var(--sans);
  color: var(--ink);
  margin: 0.4rem 0;
  border-inline-start: 3px solid var(--accent);
  padding-inline-start: 0.55rem;
}
.folio-support {
  background: var(--wash);
  border-top: 2px solid var(--accent);
  padding: clamp(1rem, 2.2vw, 1.7rem);
  display: grid;
  gap: 0.85rem;
  align-content: start;
}
.folio-support > p {
  font: 0.95rem/1.55 var(--sans);
  color: var(--ink);
  margin: 0;
}
.folio-specimen {
  background: var(--surface);
  border: 1px solid var(--folio-border);
  color: var(--ink);
  padding: 0.15rem 0.8rem;
}
.folio-bill-details {
  font: 0.88rem/1.5 var(--sans);
  color: var(--ink);
}
.folio-bill-details summary {
  padding: 0.6rem 0.1rem;
  min-height: 44px;
  cursor: pointer;
  font-weight: 600;
}
.folio-bill-details pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0.1rem 0 0;
  border-top: 1px solid var(--line);
  padding: 0.8rem 0 0;
  font: 0.79rem/1.65 var(--mono);
}
.folio-specimen[open] pre {
  margin-bottom: 0.7rem;
}
.folio-specimen summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  list-style: none;
}
.folio-specimen summary::-webkit-details-marker {
  display: none;
}
.folio-specimen summary span {
  display: inline-grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
}
.folio-specimen summary span::before,
.folio-specimen summary span::after {
  content: "";
  grid-area: 1/1;
  height: 1px;
  width: 0.72rem;
  background: currentColor;
}
.folio-specimen summary span::after {
  transform: rotate(90deg);
  transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1);
}
.folio-specimen[open] summary span::after {
  transform: rotate(0deg);
}
.folio-next {
  grid-column: 1/-1;
  border-top: 1px solid var(--line);
  padding-top: 1.2rem;
}
.folio-next .folio-hint {
  margin-top: 0.65rem;
}
.folio-live {
  font: 650 0.9rem/1.5 var(--sans);
  margin: 0.7rem 0 0;
}
.folio-live:empty {
  margin: 0;
}
.folio-permissions {
  max-width: 54rem;
}
.folio-permission {
  min-width: 0;
  margin: 0;
  padding: 0.25rem 0 1.05rem;
  border: 0;
}
.folio-permission + .folio-permission {
  padding-top: 0.45rem;
}
.folio-permission legend {
  display: block;
  width: 100%;
  padding: 0.7rem 0 0.2rem;
  border-top: 1px solid var(--line);
  font: 600 1.28rem/1.25 var(--display);
  letter-spacing: -0.015em;
}
.folio-check {
  display: flex;
  gap: 0.75rem;
  align-items: start;
  padding: 0.65rem 0.1rem;
  cursor: pointer;
  min-height: 44px;
  font: 600 0.98rem/1.45 var(--sans);
  color: var(--ink);
}
.folio-check input {
  flex: 0 0 auto;
  width: 1.15rem;
  height: 1.15rem;
  margin: 0.15em 0 0;
  accent-color: var(--accent);
}
.folio-check strong {
  font-weight: 650;
}
.folio-check small {
  display: block;
  font: 0.89rem/1.55 var(--sans);
  color: var(--muted);
  margin-top: 0.12rem;
}
.folio-attach {
  align-items: center;
  border-block: 1px solid var(--line);
}
.folio-attach input {
  margin-top: 0;
}
.folio-optional {
  margin: 0.1rem 0 0.35rem 0.62rem;
  padding-left: 1.35rem;
  border-left: 1px solid var(--folio-border);
}
.folio-optional .folio-hint {
  padding-block: 0.3rem;
}
.folio-optional a {
  color: var(--accent);
  text-underline-offset: 0.2em;
}
.folio-sheet {
  padding: 1.2rem 0 0;
  border-top: 2px solid var(--ink);
}
.folio-byline {
  color: var(--muted);
  font: 0.85rem/1.55 var(--sans);
  margin: 0.6rem 0 0.9rem;
}
.folio-byline span {
  margin-inline: 0.25em;
}
.folio-prose {
  white-space: pre-wrap;
  font: 1.08rem/1.7 var(--sans);
  color: var(--ink);
  margin: 0;
}
.folio-sheet .folio-bill-details {
  margin-top: 1.3rem;
  border-top: 1px solid var(--line);
}
.folio-summary {
  display: grid;
  margin: 0;
}
.folio-summary > div {
  display: grid;
  gap: 0.19rem;
  border-top: 1px solid var(--line);
  padding: 0.7rem 0;
}
.folio-summary dt {
  color: var(--muted);
  font: 0.78rem/1.5 var(--mono);
}
.folio-summary dd {
  margin: 0;
  color: var(--ink);
  font: 650 0.95rem/1.45 var(--sans);
}
.folio-back {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin-bottom: 0.8rem;
  font: 600 0.9rem/1.45 var(--sans);
}
.folio-note,
.folio-confirm {
  background: var(--wash);
  padding: 1rem 1.2rem;
  border-left: 3px solid var(--accent);
  margin-bottom: 1.4rem;
}
.folio-confirm {
  margin: 1.25rem 0;
  max-width: 46rem;
}
.folio-note p {
  white-space: pre-wrap;
  margin: 0.45rem 0 0;
}
.folio-confirm p {
  margin: 0.65rem 0 0.9rem;
}
.folio-draft-row {
  background: var(--wash);
  padding: 1rem;
  margin: 0 0 1.5rem;
}
.folio-draft-row p {
  color: var(--muted);
  margin: 0.35rem 0 0;
}
.folio-records {
  list-style: none;
  margin: 0;
  padding: 0;
}
.folio-records li {
  border-bottom: 1px solid var(--line);
}
.folio-records a {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 0.8rem;
  color: var(--ink);
  text-decoration: none;
  padding: 0.95rem 0.5rem;
  transition: background-color 130ms ease-out;
}
.folio-records a:hover {
  background: var(--wash);
}
.folio-records small {
  display: block;
  font: 0.88rem/1.5 var(--sans);
  margin-top: 0.12rem;
  color: var(--muted);
}
.folio-records strong {
  font-size: 1.05rem;
}
.folio-state {
  font: 0.78rem/1.5 var(--mono);
  color: var(--muted);
}
.folio-row-cue {
  color: var(--accent);
  font-size: 1.25rem;
}
.folio-empty {
  margin: 0;
  padding: 1rem 0;
}
.folio-page :is(input, textarea, button, a, summary):focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
@media (max-width: 740px) {
  .folio-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }
  .folio-grid .folio-support {
    margin-bottom: 0.1rem;
  }
  .folio-page .folio-section-head {
    margin-bottom: 0.75rem;
  }
  .folio-steps {
    margin-bottom: 1rem;
  }
}
@media (max-width: 470px) {
  .folio-pair {
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
  .folio-support {
    padding: 1rem;
  }
  .folio-records a {
    gap: 0.45rem;
    padding-inline: 0;
  }
  .folio-state {
    max-width: 8rem;
  }
  .folio-steps li > :is(a, span) {
    font-size: 0.77rem;
    gap: 0.28rem;
  }
  .folio-step-number {
    min-width: 1.25rem;
    height: 1.25rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .folio-records a,
  .folio-specimen summary span::after {
    transition: none;
  }
}

.desk-page {

  overflow-wrap: anywhere;

.desk-page h1,
.desk-page h2,
.desk-page p {

.desk-sr {

  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);

.desk-back,
.desk-text-link {

  align-items: center;

.desk-column-labels,

.desk-row {

.desk-person > span,

.desk-empty {

.desk-copy-section {

}
.desk-notes-section {

.desk-version time {

.desk-version p {
  margin: 0.3rem 0 1rem;

.desk-section {

.desk-section > label:not(.desk-sr) {
  display: block;
  margin-bottom: 0.45rem;
  font: 600 0.95rem/1.4 var(--sans);
}
.desk-page .desk-input {
  display: block;
  width: 100%;
  min-height: 6rem;
  border-radius: 2px;
  border: 1px solid var(--desk-rule);
  padding: 0.8rem 1rem;
  background: var(--surface);
  color: var(--ink);
  font: 400 1rem/1.55 var(--sans);
  resize: vertical;
}
.desk-input[aria-invalid="true"] {
  border-inline-start: 3px solid currentColor;
}
.desk-page .desk-input:focus-visible,
.desk-page :is(button, a, summary):focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}
.desk-page .desk-row:focus-visible {
  outline-offset: -3px;
}
.desk-save,
.desk-decision-note {
  font: 500 0.88rem/1.5 var(--sans);
  color: var(--muted);
}
.desk-save:not(:empty) {
  margin: 0.6rem 0;
}
.desk-save:empty {
  margin: 0;
}
.desk-decision {
  margin-top: 0.95rem;
}
.desk-decision-note {
  margin-bottom: 0.1rem;
}
.desk-note-help {
  margin: 0.55rem 0 1rem;
}
.desk-feedback:not([hidden]) {
  padding: 0.65rem 0.9rem;
  border-inline-start: 3px solid var(--ink);
  background: var(--wash);
  margin: 0.75rem 0;
}
.desk-previous-note {
  border-left: 2px solid var(--accent);
  padding-left: 0.8rem;
  margin: 1rem 0;
  font-size: 0.95rem;
}
.desk-previous-note p {
  margin: 0.25rem 0;
  white-space: pre-wrap;
}
.desk-packet-tools {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
  margin: 0 0 1.35rem;
}
.desk-packet-tools > span {
  color: var(--muted);
  font: 400 0.85rem/1.4 var(--mono);
}
.desk-paper {
  padding: clamp(1.15rem, 3vw, 2.35rem);
  border: 1px solid var(--desk-rule);
  border-top: 3px solid var(--ink);
  background: var(--surface);
}
.desk-paper h2 {
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--desk-rule);
}
.desk-document {
  margin: 0.85rem 0;
  font: 400 0.92rem/1.6 var(--mono);
  color: var(--ink);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.desk-log {
  margin-top: 1rem;
}
.desk-log-note {
  margin: 0;
}
.desk-page .btn:disabled {
  cursor: default;
  opacity: 0.68;
}
@media (max-width: 760px) {
  .desk-layout {
    grid-template-columns: minmax(0, 1fr);
    gap: 1.1rem;
  }
  .desk-review-layout {
    grid-template-areas: "source" "choices" "copy" "feedback";
    row-gap: 0.4rem;
  }
  .desk-file {
    padding: 1rem 1.15rem;
  }
  .desk-permissions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 1.15rem;
  }
  .desk-permissions > div {
    align-items: start;
    flex-direction: column;
    gap: 0.18rem;
  }
  .desk-history {
    margin-top: 0.2rem;
  }
  .desk-filters {
    gap: 0.12rem 0.35rem;
  }
  .desk-column-labels {
    display: none;
  }
  .desk-rows {
    margin-top: 0.5rem;
  }
  .desk-row {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.65rem;
    padding: 1rem;
  }
  .desk-person {
    grid-column: 1;
  }
  .desk-row time {
    grid-column: 1;
    grid-row: 2;
    font-size: 0.82rem;
  }
  .desk-row .desk-state {
    grid-column: 2;
    grid-row: 2;
  }
  .desk-row-arrow {
    grid-column: 2;
    grid-row: 1;
  }
  .desk-paper {
    margin-top: 0.5rem;
  }
}
@media (max-width: 410px) {
  .desk-filters {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .desk-filters button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
  }
  .desk-filters button span {
    min-width: 1ch;
  }
  .desk-row {
    padding: 0.85rem 0.55rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .desk-row {
    transition: none;
  }
}

  <script>
window.RECORD_SOURCE={"model.js":{"title":"Permissions and case records","summary":"How draft data, consent, review and packet eligibility are stored.","text":"/* The participant and organizer share one fictional case file in this browser. */\n(() => {\n  \"use strict\";\n\n  const storageKey = \"lacchi-fieldwork-casebook-v1\";\n  const allowedStates = [\"in-review\", \"changes-requested\", \"approved\"];\n  const textFields = [\"name\", \"city\", \"story\"];\n  const choiceFields = [\n    \"attached\",\n    \"privateOK\",\n    \"recipientOK\",\n    \"publicOK\",\n    \"nameOK\",\n    \"docOK\",\n  ];\n  const sample = Object.freeze({\n    name: \"Rowan Ellis\",\n    city: \"Reading\",\n    story:\n      \"Our electric bill went from $178 to $286. We put off replacing the tires on our car to cover it. A clearer explanation of the increase would help us plan for next month.\",\n  });\n  const sampleBill = [\n    \"Sample electric bill · Fictional document\",\n    \"Previous month  $178.00\",\n    \"Current month   $286.00\",\n    \"Change         +$108.00\",\n    \"Prepared for this demonstration using fictional amounts.\",\n  ].join(\"\\n\");\n  const now = () => new Date().toISOString();\n  const clone = (value) => JSON.parse(JSON.stringify(value));\n  const string = (value) => (typeof value === \"string\" ? value : \"\");\n\n  function readDraft(source = {}) {\n    const draft = { revisionId: string(source?.revisionId) || null };\n    for (const field of textFields) draft[field] = string(source?.[field]);\n    // A missing checkbox or a serialized string such as \"true\" never grants consent.\n    for (const field of choiceFields) draft[field] = source?.[field] === true;\n    return draft;\n  }\n\n  function validate(draft) {\n    const errors = {};\n    if (!string(draft?.name).trim()) errors.name = \"Enter a fictional name.\";\n    if (!string(draft?.city).trim())\n      errors.city = \"Enter a Pennsylvania community.\";\n    if (!string(draft?.story).trim())\n      errors.story = \"Write a short story about the bill.\";\n    if (draft?.privateOK !== true)\n      errors.privateOK = \"Allow private organizer review to submit.\";\n    return errors;\n  }\n\n  function openRecord(fields, id, at) {\n    return {\n      ...readDraft(fields),\n      revisionId: null,\n      id,\n      original: fields.story,\n      copy: fields.story,\n      status: \"in-review\",\n      note: \"\",\n      createdAt: at,\n      updatedAt: at,\n      approvedAt: null,\n      history: [{ at, text: \"Story submitted for private review.\" }],\n      log: [],\n      versions: [],\n    };\n  }\n\n  function initial() {\n    const example = {\n      name: \"Morgan Hale\",\n      city: \"Reading\",\n      attached: true,\n      privateOK: true,\n      recipientOK: true,\n      story:\n        \"We budgeted $178 for electricity. When the next bill came in at $286, we split our grocery trip across two weeks. I want the review team to know what a single increase can mean at home.\",\n    };\n    return {\n      draft: readDraft(),\n      records: [openRecord(example, \"FW-0101\", now())],\n      reviewDrafts: {},\n    };\n  }\n\n  function readEvents(value, field) {\n    if (!Array.isArray(value)) return [];\n    return value\n      .filter((row) => typeof row?.[field] === \"string\" && validTime(row.at))\n      .map((row) => ({ at: row.at, [field]: row[field] }));\n  }\n\n  function validTime(value) {\n    return typeof value === \"string\" && Number.isFinite(Date.parse(value));\n  }\n\n  function restore(raw) {\n    const saved = JSON.parse(raw);\n    if (saved.version !== 1 || !Array.isArray(saved.records))\n      throw new Error(\"Unknown workspace format.\");\n    const ids = new Set();\n    const records = saved.records.map((row) => {\n      if (\n        !row ||\n        !/^FW-[\\w-]+$/.test(row.id) ||\n        ids.has(row.id) ||\n        !allowedStates.includes(row.status) ||\n        !validTime(row.createdAt) ||\n        typeof row.original !== \"string\" ||\n        typeof row.copy !== \"string\"\n      ) {\n        throw new Error(\"Unreadable case file.\");\n      }\n      ids.add(row.id);\n      return {\n        ...readDraft(row),\n        revisionId: null,\n        id: row.id,\n        original: row.original,\n        copy: row.copy,\n        status: row.status,\n        note: string(row.note),\n        createdAt: row.createdAt,\n        updatedAt: validTime(row.updatedAt) ? row.updatedAt : row.createdAt,\n        approvedAt: validTime(row.approvedAt) ? row.approvedAt : null,\n        history: readEvents(row.history, \"text\"),\n        log: readEvents(row.log, \"text\"),\n        versions: readEvents(row.versions, \"story\"),\n      };\n    });\n    const reviewDrafts = {};\n    for (const id of ids) {\n      if (string(saved.reviewDrafts?.[id]))\n        reviewDrafts[id] = saved.reviewDrafts[id];\n    }\n    const draft = readDraft(saved.draft);\n    if (!ids.has(draft.revisionId)) draft.revisionId = null;\n    return { draft, records, reviewDrafts };\n  }\n\n  let state = initial();\n  let lastRaw;\n  let persistent = true;\n  let warning = \"\";\n  function read() {\n    if (!persistent) return state;\n    try {\n      const raw = globalThis.localStorage.getItem(storageKey);\n      if (raw !== lastRaw) {\n        if (raw) {\n          try {\n            state = restore(raw);\n          } catch {\n            state = initial();\n            warning =\n              \"The saved workspace could not be read. A fresh example is open.\";\n          }\n        } else if (lastRaw !== undefined) {\n          state = initial();\n        }\n        lastRaw = raw;\n      }\n    } catch {\n      useMemory();\n    }\n    return state;\n  }\n\n  function useMemory() {\n    persistent = false;\n    warning =\n      \"Browser storage is unavailable. Keep this tab open to keep your work.\";\n  }\n\n  function commit() {\n    if (!persistent) return;\n    const serialized = JSON.stringify({ version: 1, ...state });\n    try {\n      globalThis.localStorage.setItem(storageKey, serialized);\n      lastRaw = serialized;\n    } catch {\n      useMemory();\n    }\n  }\n\n  function find(id) {\n    const record = read().records.find((item) => item.id === id);\n    if (!record) throw new Error(\"This case could not be found.\");\n    return record;\n  }\n\n  function patchDraft(patch) {\n    const { draft } = read();\n    // Revision identity belongs to the workflow. Typing in a form cannot redirect it to another case.\n    state.draft = readDraft({\n      ...draft,\n      ...patch,\n      revisionId: draft.revisionId,\n    });\n    if (patch.attached === false) state.draft.docOK = false;\n    if (patch.recipientOK === false) {\n      state.draft.nameOK = false;\n      state.draft.docOK = false;\n    }\n    commit();\n    return clone(state.draft);\n  }\n\n  function fillSample() {\n    const { draft } = read();\n    const patch = {};\n    for (const field of textFields)\n      if (!draft[field].trim()) patch[field] = sample[field];\n    return patchDraft(patch);\n  }\n\n  function hasDraft() {\n    const { draft } = read();\n    return Boolean(\n      draft.revisionId ||\n        textFields.some((key) => draft[key].length) ||\n        choiceFields.some((key) => draft[key]),\n    );\n  }\n\n  function revise(id, replace = false) {\n    const record = find(id);\n    if (state.draft.revisionId === id) return clone(state.draft);\n    if (hasDraft() && !replace)\n      throw new Error(\n        \"Replace the unfinished draft before revising this story.\",\n      );\n    state.draft = readDraft({\n      ...record,\n      story: record.original,\n      revisionId: record.id,\n    });\n    commit();\n    return clone(state.draft);\n  }\n\n  function submit() {\n    const { draft, records } = read();\n    const errors = Object.values(validate(draft));\n    if (errors.length) throw new Error(errors[0]);\n    const at = now();\n    const fields = readDraft(draft);\n    for (const field of textFields) fields[field] = fields[field].trim();\n    let record;\n    if (draft.revisionId) {\n      record = find(draft.revisionId);\n      record.versions.push({ at: record.updatedAt, story: record.original });\n      Object.assign(record, fields, {\n        original: fields.story,\n        copy: fields.story,\n        revisionId: null,\n        status: \"in-review\",\n        updatedAt: at,\n        approvedAt: null,\n        note: \"\",\n        log: [],\n      });\n      record.history.push({\n        at,\n        text: \"Participant submitted a revision. A new review is required.\",\n      });\n      delete state.reviewDrafts[record.id];\n    } else {\n      // File numbers are local labels. Sequential IDs keep queue rows and printed packets easy to match.\n      const last = records.reduce((highest, item) => {\n        const match = /^FW-(\\d+)$/.exec(item.id);\n        return match ? Math.max(highest, Number(match[1])) : highest;\n      }, 100);\n      record = openRecord(\n        fields,\n        \"FW-\" + String(last + 1).padStart(4, \"0\"),\n        at,\n      );\n      records.unshift(record);\n    }\n    state.draft = readDraft();\n    commit();\n    return clone(record);\n  }\n\n  function permitted(record) {\n    return (\n      record?.privateOK === true &&\n      record.recipientOK === true &&\n      Boolean(string(record.copy).trim())\n    );\n  }\n  const canApprove = (record) =>\n    record?.status === \"in-review\" && permitted(record);\n  const canExport = (record) =>\n    record?.status === \"approved\" &&\n    validTime(record.approvedAt) &&\n    permitted(record);\n\n  function editCopy(id, text) {\n    const record = find(id);\n    if (typeof text !== \"string\")\n      throw new Error(\"Enter the recipient copy as text.\");\n    if (record.copy === text) return clone(record);\n    const at = now();\n    if (record.status === \"approved\") {\n      record.status = \"in-review\";\n      record.history.push({\n        at,\n        text: \"Recipient copy changed. Approval cleared.\",\n      });\n    }\n    record.copy = text;\n    record.approvedAt = null;\n    record.updatedAt = at;\n    record.log = [];\n    commit();\n    return clone(record);\n  }\n\n  function saveNote(id, note) {\n    find(id);\n    if (typeof note !== \"string\")\n      throw new Error(\"Enter the feedback as text.\");\n    if (note) state.reviewDrafts[id] = note;\n    else delete state.reviewDrafts[id];\n    commit();\n    return note;\n  }\n\n  function requestChanges(id, note) {\n    const record = find(id);\n    const message = string(note).trim();\n    if (!message)\n      throw new Error(\"Describe the change you want the participant to make.\");\n    const at = now();\n    Object.assign(record, {\n      note: message,\n      status: \"changes-requested\",\n      approvedAt: null,\n      updatedAt: at,\n      log: [],\n    });\n    record.history.push({\n      at,\n      text: \"Organizer requested participant changes.\",\n    });\n    delete state.reviewDrafts[id];\n    commit();\n    return clone(record);\n  }\n\n  function approve(id) {\n    const record = find(id);\n    if (!canApprove(record))\n      throw new Error(\n        \"A recipient copy needs permission and an open review before approval.\",\n      );\n    const at = now();\n    Object.assign(record, {\n      status: \"approved\",\n      approvedAt: at,\n      updatedAt: at,\n    });\n    record.history.push({ at, text: \"Organizer approved the recipient copy.\" });\n    commit();\n    return clone(record);\n  }\n\n  function packet(id) {\n    const record = find(id);\n    if (!canExport(record))\n      throw new Error(\n        \"An approved copy and recipient permission are required.\",\n      );\n    // Construct the export field by field. The submitted original, feedback, drafts and history stay here.\n    const lines = [\n      \"Reading city energy bill study · Demonstration packet\",\n      \"Recipient: fictional city energy study team\",\n      \"\",\n      \"Case \" + record.id,\n      \"Community: \" + record.city + \", Pennsylvania\",\n      \"Contributor: \" + (record.nameOK ? record.name : \"Name withheld\"),\n      \"\",\n      \"Approved recipient copy\",\n      record.copy,\n      \"\",\n      \"Public reuse: \" +\n        (record.publicOK ? \"permission recorded\" : \"permission withheld\"),\n    ];\n    if (record.attached && record.docOK) lines.push(\"\", sampleBill);\n    lines.push(\n      \"\",\n      \"This packet is a fictional example. Delivery is simulated.\",\n    );\n    return lines.join(\"\\n\");\n  }\n\n  function simulate(id) {\n    const record = find(id);\n    if (!canExport(record))\n      throw new Error(\n        \"Approve a permitted recipient copy before simulating delivery.\",\n      );\n    if (!record.log.length) {\n      const at = now();\n      record.log.push({\n        at,\n        text: \"Simulated delivery. No external recipient was contacted.\",\n      });\n      record.updatedAt = at;\n      commit();\n    }\n    return clone(record);\n  }\n\n  globalThis.Book = Object.freeze({\n    get: () => clone(read()),\n    getRecord: (id) =>\n      clone(read().records.find((row) => row.id === id) || null),\n    sample,\n    sampleBill,\n    validate,\n    hasDraft,\n    patchDraft,\n    fillSample,\n    revise,\n    submit,\n    editCopy,\n    saveNote,\n    requestChanges,\n    canApprove,\n    canExport,\n    approve,\n    packet,\n    simulate,\n    storageOK: () => {\n      read();\n      return persistent;\n    },\n    notice: () => {\n      read();\n      return warning;\n    },\n    reset: () => {\n      state = initial();\n      if (persistent) warning = \"\";\n      commit();\n      return clone(state);\n    },\n  });\n})();\n"},"model.test.cjs":{"title":"Behavior tests","summary":"Checks for consent, drafts, revisions and permitted exports.","text":"const { test } = require(\"node:test\");\nconst assert = require(\"node:assert/strict\");\nconst fs = require(\"node:fs\");\nconst path = require(\"node:path\");\nconst vm = require(\"node:vm\");\n\nconst source = fs.readFileSync(path.join(__dirname, \"../src/model.js\"), \"utf8\");\nconst key = \"lacchi-fieldwork-casebook-v1\";\n\nfunction open(\n  entries = new Map(),\n  localStorage = {\n    getItem: (name) => entries.get(name) ?? null,\n    setItem: (name, value) => entries.set(name, value),\n  },\n) {\n  const context = vm.createContext({ localStorage });\n  vm.runInContext(source, context);\n  return context.Book;\n}\n\nfunction submit(book, flags = {}) {\n  book.fillSample();\n  book.patchDraft({\n    privateOK: true,\n    recipientOK: true,\n    attached: true,\n    ...flags,\n  });\n  return book.submit();\n}\n\ntest(\"the demo starts with a fictional organizer case and a clean participant draft\", () => {\n  const book = open();\n  assert.equal(book.hasDraft(), false);\n  assert.equal(book.get().records.length, 1);\n  const seed = book.getRecord(\"FW-0101\");\n  assert.equal(seed.status, \"in-review\");\n  assert.equal(seed.name, \"Morgan Hale\");\n  assert.equal(book.canApprove(seed), true);\n  assert.equal(book.getRecord(\"missing\"), null);\n  seed.copy = \"Mutated snapshot\";\n  assert.notEqual(book.getRecord(seed.id).copy, seed.copy);\n});\n\ntest(\"sample fill preserves authored text and does not grant permissions\", () => {\n  const book = open();\n  book.patchDraft({ name: \"Custom name\", story: \"My handwritten account.\" });\n  const draft = book.fillSample();\n  assert.equal(draft.name, \"Custom name\");\n  assert.equal(draft.story, \"My handwritten account.\");\n  assert.ok(draft.city);\n  assert.deepEqual(Object.keys(book.validate(draft)), [\"privateOK\"]);\n  assert.throws(() => book.submit(), /private/i);\n  assert.equal(book.get().records.length, 1);\n});\n\ntest(\"each new case receives a distinct local number; stored work survives reopening\", () => {\n  const disk = new Map();\n  const book = open(disk);\n  const submitted = submit(book);\n  assert.equal(submitted.id, \"FW-0102\");\n  const next = open(disk);\n  assert.equal(next.hasDraft(), false);\n  assert.equal(next.getRecord(submitted.id).original, submitted.story);\n  assert.equal(submit(next).id, \"FW-0103\");\n  assert.equal(book.get().records[0].id, \"FW-0103\");\n});\n\ntest(\"only the approved recipient copy and permitted fields enter the downloadable packet\", () => {\n  const book = open();\n  book.patchDraft({\n    name: \"Private contributor\",\n    city: \"Reading\",\n    story: \"Private original\",\n    privateOK: true,\n    attached: true,\n    recipientOK: true,\n  });\n  const { id } = book.submit();\n  book.saveNote(id, \"Organizer's private draft.\");\n  book.editCopy(id, \"Redacted delivery text.\");\n  assert.throws(() => book.packet(id));\n  book.approve(id);\n  const packet = book.packet(id);\n  assert.match(packet, /Redacted delivery text/);\n  assert.match(packet, /Name withheld/);\n  assert.doesNotMatch(\n    packet,\n    /Private contributor|Private original|private draft|Previous month/,\n  );\n  assert.equal(book.getRecord(id).original, \"Private original\");\n});\n\ntest(\"identity, document and reuse permissions are independent\", () => {\n  const book = open();\n  const allowed = submit(book, { docOK: true, publicOK: true, nameOK: false });\n  book.approve(allowed.id);\n  assert.match(book.packet(allowed.id), /Sample electric bill/);\n  assert.match(book.packet(allowed.id), /Name withheld/);\n  assert.match(book.packet(allowed.id), /permission recorded/);\n  const identityOnly = submit(book, {\n    nameOK: true,\n    docOK: true,\n    attached: false,\n  });\n  book.approve(identityOnly.id);\n  assert.equal(book.packet(identityOnly.id).includes(identityOnly.name), true);\n  assert.doesNotMatch(book.packet(identityOnly.id), /Sample electric bill/);\n});\n\ntest(\"private-only and empty recipient copies cannot be approved, exported, or delivered\", () => {\n  const book = open();\n  const record = submit(book, {\n    recipientOK: false,\n    docOK: true,\n    nameOK: true,\n  });\n  for (const fn of [book.approve, book.packet, book.simulate])\n    assert.throws(() => fn(record.id));\n  assert.equal(book.canApprove(record), false);\n  const blank = submit(book);\n  book.editCopy(blank.id, \"  \");\n  assert.equal(book.canApprove(book.getRecord(blank.id)), false);\n  assert.throws(() => book.approve(blank.id));\n});\n\ntest(\"an edit invalidates old approval and simulated delivery; a no-op edit preserves them\", () => {\n  const book = open();\n  const record = submit(book);\n  book.approve(record.id);\n  assert.equal(book.simulate(record.id).log.length, 1);\n  assert.equal(book.simulate(record.id).log.length, 1);\n  assert.equal(book.editCopy(record.id, record.copy).status, \"approved\");\n  assert.equal(\n    book.editCopy(record.id, \"New delivery copy\").status,\n    \"in-review\",\n  );\n  const changed = book.getRecord(record.id);\n  assert.equal(changed.approvedAt, null);\n  assert.equal(changed.log.length, 0);\n  assert.equal(changed.original, record.original);\n  assert.throws(() => book.packet(record.id));\n});\n\ntest(\"revision protects unsaved work and discards obsolete approval, export, and feedback\", () => {\n  const disk = new Map();\n  const book = open(disk);\n  const record = submit(book);\n  book.approve(record.id);\n  book.simulate(record.id);\n  book.saveNote(record.id, \"Unissued feedback\");\n  assert.equal(open(disk).get().reviewDrafts[record.id], \"Unissued feedback\");\n  assert.equal(book.getRecord(record.id).note, \"\");\n  assert.throws(() => book.requestChanges(record.id, \" \"));\n  const requested = book.requestChanges(record.id, \"Please clarify the month.\");\n  assert.equal(requested.status, \"changes-requested\");\n  assert.equal(requested.note, \"Please clarify the month.\");\n  assert.equal(book.get().reviewDrafts[record.id], undefined);\n  assert.throws(() => book.approve(record.id));\n  book.patchDraft({ name: \"Unrelated draft\" });\n  assert.throws(() => book.revise(record.id), /unfinished/i);\n  assert.equal(book.get().draft.name, \"Unrelated draft\");\n  book.revise(record.id, true);\n  book.patchDraft({ story: \"Clarified account.\" });\n  assert.equal(book.revise(record.id).story, \"Clarified account.\");\n  const revised = book.submit();\n  assert.equal(revised.id, record.id);\n  assert.equal(revised.original, \"Clarified account.\");\n  assert.equal(revised.copy, revised.original);\n  assert.equal(revised.versions[0].story, record.original);\n  assert.equal(revised.log.length, 0);\n  assert.equal(revised.status, \"in-review\");\n  assert.equal(revised.note, \"\");\n});\n\ntest(\"corrupt saves recover locally; string values do not restore consent\", () => {\n  const disk = new Map([[key, \"{ broken }\"]]);\n  const book = open(disk);\n  assert.equal(book.get().records.length, 1);\n  assert.match(book.notice(), /could not be read/);\n  const record = submit(book);\n  const saved = JSON.parse(disk.get(key));\n  saved.records[0].recipientOK = \"true\";\n  disk.set(key, JSON.stringify(saved));\n  assert.equal(book.canApprove(book.getRecord(record.id)), false);\n  book.reset();\n  assert.equal(book.get().records.length, 1);\n  assert.equal(book.notice(), \"\");\n});\n\ntest(\"storage failure preserves current-tab work and the reason is exposed to the UI\", () => {\n  const blocked = {\n    getItem: () => null,\n    setItem: () => {\n      throw new Error(\"Storage blocked\");\n    },\n  };\n  const book = open(new Map(), blocked);\n  const record = submit(book);\n  assert.equal(book.storageOK(), false);\n  assert.match(book.notice(), /Keep this tab open/);\n  assert.equal(book.getRecord(record.id).story, record.story);\n});\n\ntest(\"reset clears only the independent preview's key\", () => {\n  const disk = new Map([[\"other-site-demo\", \"preserve\"]]);\n  const book = open(disk);\n  submit(book);\n  book.reset();\n  assert.equal(book.get().records.length, 1);\n  assert.equal(book.get().records[0].id, \"FW-0101\");\n  assert.equal(disk.get(\"other-site-demo\"), \"preserve\");\n});\n"},"participant.js":{"title":"Participant pages","summary":"Story entry, attachment, sharing choices, preview and receipt.","text":"(function participantWorkspace() {\n  \"use strict\";\n\n  const esc = (value) => App.esc(String(value ?? \"\"));\n  const idPath = (route, id) => `#/${route}/${encodeURIComponent(id)}`;\n  const statusLabel = {\n    \"in-review\": \"In review\",\n    \"changes-requested\": \"Changes requested\",\n    approved: \"Approved\",\n  };\n  const steps = [\n    { title: \"Story\", path: \"/write\" },\n    { title: \"Sharing\", path: \"/permissions\" },\n    { title: \"Preview\", path: \"/preview\" },\n  ];\n  const textFields = [\"name\", \"city\", \"story\"];\n\n  function stepsNav(active) {\n    const items = steps.map((step, index) => {\n      const content = `\u003cspan class=\"folio-step-number\">${index + 1}\u003c/span>${step.title}`;\n      return `\u003cli${active === index ? ' aria-current=\"step\"' : \"\"}>${\n        index \u003c active\n          ? `\u003ca href=\"#${step.path}\">${content}\u003c/a>`\n          : `\u003cspan>${content}\u003c/span>`\n      }\u003c/li>`;\n    });\n    return `\u003cnav class=\"folio-steps\" aria-label=\"Submission steps\">\u003col>${items.join(\"\")}\u003c/ol>\u003c/nav>`;\n  }\n\n  function storageMessage() {\n    return Book.storageOK()\n      ? \"Your draft saves in this browser as you write.\"\n      : \"Your browser cannot save this draft. Keep this page open while you work.\";\n  }\n\n  function setFeedback(host, message) {\n    const feedback = host.querySelector(\"[data-feedback]\");\n    if (feedback) feedback.textContent = message;\n  }\n\n  function billDetails() {\n    return `\u003cdetails class=\"folio-bill-details\">\u003csummary>Read the sample bill\u003c/summary>\u003cpre>${esc(Book.sampleBill)}\u003c/pre>\u003c/details>`;\n  }\n\n  function fieldError(input, message) {\n    const error = input.ownerDocument.getElementById(`${input.id}-error`);\n    error.textContent = message || \"\";\n    error.hidden = !message;\n    if (message) input.setAttribute(\"aria-invalid\", \"true\");\n    else input.removeAttribute(\"aria-invalid\");\n  }\n\n  function draftMessage(host) {\n    host.querySelector(\"[data-save]\").textContent = storageMessage();\n  }\n\n  function write(host) {\n    const draft = Book.get().draft;\n    const input = (key, name) => `\u003cdiv class=\"folio-field\">\n      \u003clabel for=\"writer-${key}\">${name}\u003c/label>\n      \u003cinput id=\"writer-${key}\" name=\"${key}\" required autocomplete=\"off\" type=\"text\" value=\"${esc(draft[key])}\" aria-describedby=\"writer-${key}-error\">\n      \u003cp id=\"writer-${key}-error\" class=\"folio-error\" hidden>\u003c/p>\n    \u003c/div>`;\n    host.innerHTML = `\u003cdiv class=\"page folio-page\">\n      ${stepsNav(0)}\n      \u003cheader class=\"page-head\">\u003ch1>${draft.revisionId ? \"Revise your story\" : \"Write your story\"}\u003c/h1>\n      \u003cp>For the city’s energy bill study, describe how a change in the electric bill affected a fictional Reading household. You’ll choose what the study team can see.\u003c/p>\u003c/header>\n      \u003cform novalidate class=\"folio-grid\">\n        \u003csection class=\"folio-manuscript\" aria-labelledby=\"writer-fields\">\n          \u003cdiv class=\"folio-section-head\">\u003ch2 id=\"writer-fields\">Household account\u003c/h2>\u003cbutton type=\"button\" class=\"folio-text-action\" data-sample>Fill empty fields with a sample\u003c/button>\u003c/div>\n          \u003cdiv class=\"folio-pair\">${input(\"name\", \"Fictional name\")}${input(\"city\", \"City or town\")}\u003c/div>\n          \u003cdiv class=\"folio-field\">\u003clabel for=\"writer-story\">Your story\u003c/label>\n            \u003ctextarea id=\"writer-story\" name=\"story\" rows=\"7\" required aria-describedby=\"writer-story-hint writer-story-error\">${esc(draft.story)}\u003c/textarea>\n            \u003cp id=\"writer-story-hint\" class=\"folio-hint\">What changed? What did that mean for the household?\u003c/p>\n            \u003cp id=\"writer-story-error\" class=\"folio-error\" hidden>\u003c/p>\n          \u003c/div>\n        \u003c/section>\n        \u003caside class=\"folio-support\" aria-labelledby=\"writer-support\">\n          \u003ch2 id=\"writer-support\">Supporting document\u003c/h2>\n          \u003cp>You can attach a fictional electric bill for the organizer. You choose who else can see it in the next step.\u003c/p>\n          \u003cdetails class=\"folio-bill-details folio-specimen\">\u003csummary>Read the sample bill\u003cspan aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cpre>${esc(Book.sampleBill)}\u003c/pre>\u003c/details>\n          \u003clabel class=\"folio-check folio-attach\">\u003cinput type=\"checkbox\" name=\"attached\"${draft.attached ? \" checked\" : \"\"}>\u003cspan>Attach sample bill\u003c/span>\u003c/label>\n        \u003c/aside>\n        \u003cdiv class=\"folio-next\">\u003cdiv class=\"actions\">\u003cbutton type=\"submit\" class=\"btn primary\">Continue to sharing\u003c/button>\n          \u003ca class=\"folio-text-action\" href=\"#/stories\">View my stories\u003c/a>\u003c/div>\n          \u003cp class=\"folio-hint\" data-save>${storageMessage()}\u003c/p>\n          \u003cp class=\"folio-live\" role=\"status\" data-feedback>\u003c/p>\n        \u003c/div>\n      \u003c/form>\u003c/div>`;\n\n    const form = host.querySelector(\"form\");\n    form.addEventListener(\"input\", (event) => {\n      const field = event.target;\n      if (textFields.includes(field.name)) {\n        Book.patchDraft({ [field.name]: field.value });\n        if (field.getAttribute(\"aria-invalid\") === \"true\")\n          fieldError(\n            field,\n            field.value.trim()\n              ? \"\"\n              : Book.validate(Book.get().draft)[field.name],\n          );\n      } else if (field.name === \"attached\") {\n        Book.patchDraft(\n          field.checked\n            ? { attached: true }\n            : { attached: false, docOK: false },\n        );\n      }\n      draftMessage(host);\n    });\n    form.querySelector(\"[data-sample]\").addEventListener(\"click\", () => {\n      const previous = Book.get().draft;\n      const next = Book.fillSample();\n      for (const key of textFields) {\n        const field = form.elements.namedItem(key);\n        field.value = next[key];\n        fieldError(field, \"\");\n      }\n      const changed = textFields.some((key) => next[key] !== previous[key]);\n      setFeedback(\n        host,\n        changed\n          ? \"Sample details added to the empty fields.\"\n          : \"All three story fields already have text.\",\n      );\n      draftMessage(host);\n    });\n    form.addEventListener(\"submit\", (event) => {\n      event.preventDefault();\n      const errors = Book.validate(Book.get().draft);\n      for (const key of textFields)\n        fieldError(form.elements.namedItem(key), errors[key]);\n      const missing = textFields.find((key) => errors[key]);\n      if (missing) return form.elements.namedItem(missing).focus();\n      App.go(\"/permissions\");\n    });\n  }\n\n  function choice(key, title, detail, draft) {\n    return `\u003clabel class=\"folio-check\">\u003cinput type=\"checkbox\" name=\"${key}\" ${draft[key] ? \"checked\" : \"\"}${key === \"privateOK\" ? ' required aria-describedby=\"permission-error\"' : \"\"}>\n      \u003cspan>\u003cstrong>${title}\u003c/strong>\u003csmall>${detail}\u003c/small>\u003c/span>\u003c/label>`;\n  }\n\n  function permissions(host) {\n    const draft = Book.get().draft;\n    host.innerHTML = `\u003cdiv class=\"page folio-page\">\n      ${stepsNav(1)}\n      \u003cheader class=\"page-head\">\u003ch1>Choose who can see it\u003c/h1>\u003cp>Give each audience its own permission. You can change these choices when you revise your story.\u003c/p>\u003c/header>\n      \u003cform class=\"folio-permissions\" novalidate>\n        \u003cfieldset class=\"folio-permission\">\u003clegend>Organizer\u003c/legend>\n          ${choice(\"privateOK\", \"Allow private review\", \"Required to submit. An organizer can read your original story and any attached sample bill.\", draft)}\n          \u003cp id=\"permission-error\" class=\"folio-error\" hidden>\u003c/p>\n        \u003c/fieldset>\n        \u003cfieldset class=\"folio-permission\">\u003clegend>Recipient\u003c/legend>\n          ${choice(\"recipientOK\", \"Allow a recipient packet\", \"An organizer can prepare an edited copy for the fictional city study team.\", draft)}\n          \u003cdiv class=\"folio-optional\" data-packet-options>\n            ${choice(\"nameOK\", \"Include my name\", \"Adds your name to the packet. Names written inside the story stay in its text unless edited.\", draft)}\n            ${draft.attached ? choice(\"docOK\", \"Include the sample bill\", \"The attached bill otherwise stays with the organizer.\", draft) : '\u003cp class=\"folio-hint\">You can include a bill here if you \u003ca href=\"#/write\">attach the sample\u003c/a> to your story.\u003c/p>'}\n          \u003c/div>\n        \u003c/fieldset>\n        \u003cfieldset class=\"folio-permission\">\u003clegend>Public\u003c/legend>\n          ${choice(\"publicOK\", \"Allow public reuse\", \"Records your choice separately. This demo never publishes a story.\", draft)}\n        \u003c/fieldset>\n        \u003cdiv class=\"folio-next\">\u003cdiv class=\"actions\">\u003cbutton type=\"submit\" class=\"btn primary\">Preview my story\u003c/button>\n          \u003ca class=\"folio-text-action\" href=\"#/write\">Back to story\u003c/a>\u003c/div>\n          \u003cp class=\"folio-error\" data-story-missing hidden>Finish the name, town and story before previewing. \u003ca href=\"#/write\">Return to story details\u003c/a>\u003c/p>\n          \u003cp class=\"folio-hint\" data-save>${storageMessage()}\u003c/p>\n          \u003cp class=\"folio-live\" role=\"status\" data-feedback>\u003c/p>\n        \u003c/div>\n      \u003c/form>\u003c/div>`;\n\n    const form = host.querySelector(\"form\");\n    const privateInput = form.elements.namedItem(\"privateOK\");\n    const privateError = host.querySelector(\"#permission-error\");\n    const options = form.querySelector(\"[data-packet-options]\");\n\n    function syncPacketChoices() {\n      options.hidden = !form.elements.namedItem(\"recipientOK\").checked;\n      for (const control of options.querySelectorAll(\"input\"))\n        control.disabled = options.hidden;\n    }\n\n    syncPacketChoices();\n    form.addEventListener(\"change\", (event) => {\n      const input = event.target;\n      if (!input.name) return;\n      if (input.name === \"recipientOK\" && !input.checked) {\n        // Withdrawing packet permission also withdraws both optional attachments to the packet.\n        Book.patchDraft({ recipientOK: false, nameOK: false, docOK: false });\n        for (const control of options.querySelectorAll(\"input\"))\n          control.checked = false;\n      } else Book.patchDraft({ [input.name]: input.checked });\n      syncPacketChoices();\n      if (privateInput.checked) {\n        privateInput.removeAttribute(\"aria-invalid\");\n        privateError.hidden = true;\n        privateError.textContent = \"\";\n      }\n      draftMessage(host);\n    });\n    form.addEventListener(\"submit\", (event) => {\n      event.preventDefault();\n      const errors = Book.validate(Book.get().draft);\n      if (textFields.some((key) => errors[key])) {\n        const warning = form.querySelector(\"[data-story-missing]\");\n        warning.hidden = false;\n        warning.querySelector(\"a\").focus();\n        return;\n      }\n      if (errors.privateOK) {\n        privateError.hidden = false;\n        privateError.textContent = errors.privateOK;\n        privateInput.setAttribute(\"aria-invalid\", \"true\");\n        privateInput.focus();\n        return;\n      }\n      App.go(\"/preview\");\n    });\n  }\n\n  function shareSummary(record) {\n    const share = record.privateOK && record.recipientOK;\n    const recipient = share\n      ? `${record.nameOK ? \"Name included\" : \"Name withheld\"} · ${record.attached && record.docOK ? \"Bill included\" : \"No bill included\"}`\n      : \"No packet permitted\";\n    const rows = [\n      [\n        \"Organizer\",\n        record.privateOK\n          ? record.attached\n            ? \"Story and sample bill\"\n            : \"Story only\"\n          : \"Private review withheld\",\n      ],\n      [\"Recipient\", recipient],\n      [\n        \"Public reuse\",\n        record.publicOK ? \"Permission recorded\" : \"Permission withheld\",\n      ],\n    ];\n    return `\u003cdl class=\"folio-summary\">${rows.map(([term, value]) => `\u003cdiv>\u003cdt>${term}\u003c/dt>\u003cdd>${esc(value)}\u003c/dd>\u003c/div>`).join(\"\")}\u003c/dl>`;\n  }\n\n  function manuscript(record, heading, story) {\n    return `\u003carticle class=\"folio-sheet\">\u003ch2>${heading}\u003c/h2>\u003cdiv class=\"folio-byline\">${esc(record.name)} \u003cspan aria-hidden=\"true\">/\u003c/span> ${esc(record.city)}, Pennsylvania\u003c/div>\n      \u003cp class=\"folio-prose\">${esc(story)}\u003c/p>${record.attached ? billDetails() : \"\"}\u003c/article>`;\n  }\n\n  function actionState(host, title, description, href, action) {\n    host.innerHTML = `\u003cdiv class=\"page folio-page\">\u003cheader class=\"page-head\">\u003ch1>${title}\u003c/h1>\u003cp>${description}\u003c/p>\u003c/header>\u003ca class=\"btn primary\" href=\"${href}\">${action}\u003c/a>\u003c/div>`;\n  }\n\n  function preview(host) {\n    const draft = Book.get().draft;\n    const errors = Book.validate(draft);\n    if (textFields.some((key) => errors[key]))\n      return actionState(\n        host,\n        \"Your story comes first\",\n        \"Add a fictional name, town and story before reviewing the entry.\",\n        \"#/write\",\n        \"Write your story\",\n      );\n    if (!draft.privateOK)\n      return actionState(\n        host,\n        \"Choose your permissions\",\n        \"Allow an organizer to read your entry before sending it to the demo queue.\",\n        \"#/permissions\",\n        \"Review sharing choices\",\n      );\n    host.innerHTML = `\u003cdiv class=\"page folio-page\">${stepsNav(2)}\n      \u003cheader class=\"page-head\">\u003ch1>Read your submission\u003c/h1>\u003cp>Check the organizer’s copy and your sharing choices before adding the story to the local review queue.\u003c/p>\u003c/header>\n      \u003cdiv class=\"folio-grid\">${manuscript(draft, \"Story for review\", draft.story)}\n        \u003caside class=\"folio-support\">\u003ch2>Sharing choices\u003c/h2>${shareSummary(draft)}\u003ca class=\"folio-text-action\" href=\"#/permissions\">Edit sharing choices\u003c/a>\u003c/aside>\n        \u003cdiv class=\"folio-next\">\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" type=\"button\" data-file>${draft.revisionId ? \"Submit revised story\" : \"Submit for review\"}\u003c/button>\n          \u003ca href=\"#/write\" class=\"folio-text-action\">Edit story\u003c/a>\u003c/div>\n          \u003cp class=\"folio-hint\">Fictional demo. Nothing is sent outside this browser.\u003c/p>\u003cp class=\"folio-live\" role=\"status\" data-feedback>\u003c/p>\u003c/div>\n      \u003c/div>\u003c/div>`;\n    host.querySelector(\"[data-file]\").addEventListener(\"click\", () => {\n      try {\n        const record = Book.submit();\n        App.go(`/receipt/${encodeURIComponent(record.id)}`);\n      } catch (error) {\n        setFeedback(host, error.message);\n      }\n    });\n  }\n\n  function dateLabel(value) {\n    const date = new Date(value);\n    return Number.isNaN(date.getTime())\n      ? \"\"\n      : date.toLocaleDateString(\"en-US\", {\n          month: \"short\",\n          day: \"numeric\",\n          year: \"numeric\",\n        });\n  }\n\n  function stories(host) {\n    const { draft, records } = Book.get();\n
