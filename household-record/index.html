(function householdRecord() {
  const editions = [
    { id: "blueprint", name: "Blueprint", color: "#1852a5" },
    { id: "garden", name: "Common Ground", color: "#5a7144" },
    { id: "parade", name: "Paper Parade", color: "#b44756" },
  ];
  const host = document.querySelector("#main");
  const status = document.querySelector("#app-status");
  const editionSelect = document.querySelector("#edition-select");
  const picker = document.querySelector("#editions");
  const storedEditionKey = "lacchi-household-record-edition-v1";
  const isEdition = (value) => editions.some((item) => item.id === value);
  let edition = editions[0].id;
  try {
    const saved = localStorage.getItem(storedEditionKey);
    if (isEdition(saved)) edition = saved;
    else if (saved !== null) localStorage.removeItem(storedEditionKey);
  } catch {
    /* The preview also works in browsers which block local storage. */
  }
  function esc(value) {
    return String(value ?? "").replace(
      /[&<>"']/g,
      (char) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char],
    );
  }
  function download(text, name) {
    const address = URL.createObjectURL(
      new Blob([text], { type: "text/plain;charset=utf-8" }),
    );
    const link = Object.assign(document.createElement("a"), {
      href: address,
      download: name,
    });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(address), 2000);
  }
  function route() {
    const path = location.hash.slice(1);
    return path.startsWith("/") ? path : "/";
  }
  function go(path) {
    if (route() === path) render(true);
    else location.hash = path;
  }
  window.App = Object.freeze({ esc, download, go });
  const arrow = '<span class="arrow" aria-hidden="true">↗</span>';
  const stageHeadlines = {
    blueprint: "Anatomy of<br><em>an energy bill.</em>",
    garden: "What a home<br><em>runs on.</em>",
    parade: "A letter from<br><em>our kitchen.</em>",
  };
  function casebookStrip() {
    const records = Book.get().records;
    const pending = records.filter(
      (record) => record.status === "in-review",
    ).length;
    const latest = records.find((record) => Book.canExport(record));
    const draft = Book.hasDraft();
    const cell = (label, text, href) =>
      href
        ? `<a href="${esc(href)}"><span>${esc(label)}</span><strong>${esc(text)}</strong><i aria-hidden="true">↗</i></a>`
        : `<div class="ledger-cell"><span>${esc(label)}</span><strong>${esc(text)}</strong></div>`;
    return `<section class="cover-foot" aria-labelledby="casebook-title"><div class="path-heading"><p class="eyebrow">Saved in this browser</p><h2 id="casebook-title">Your casebook.</h2></div>
      <div class="path-links">${cell("Participant draft", draft ? "Continue your draft" : "No draft in progress", draft ? "#/write" : null)}
      ${cell("Organizer queue", pending === 1 ? "1 case in review" : pending + " cases in review", "#/desk")}
      ${cell("Recipient packet", latest ? "Open approved packet" : "Awaiting approval", latest ? "#/packet/" + latest.id : null)}</div></section>`;
  }
  function renderCampaign() {
    const current = editions.find((item) => item.id === edition);
    host.innerHTML = `<section class="cover" aria-labelledby="cover-title">
      <div class="cover-copy">
        <p class="issue-line"><span class="issue-dash"></span>Reading, Pennsylvania <b aria-hidden="true">/</b> City energy bill study</p>
        <h1 id="cover-title">${stageHeadlines[edition]}</h1>
        <p class="standfirst">This fictional city campaign studies what Reading households pay for electricity. Residents share bills and stories to help the city explore ways to lower those bills.</p>
        <div class="cover-actions"><a class="btn primary" href="#/write">${Book.hasDraft() ? "Continue your story" : "Write a story"} ${arrow}</a><a class="desk-link" href="#/desk">Open organizer desk <span aria-hidden="true">→</span></a></div>
        <p class="cover-note"><span aria-hidden="true" class="note-dot"></span>Use sample details. Your entries stay in this browser.</p>
      </div><div class="exhibit" aria-label="${esc(current.name)} campaign exhibit"></div></section>
      ${casebookStrip()}`;
    Exhibit.render(host.querySelector(".exhibit"), edition);
  }
  function guide() {
    host.innerHTML = `<section class="guide-page"><p class="eyebrow">Demo guide</p><h1>Walk through a case.</h1><p class="read-intro">This city energy bill study is a fictional campaign set in Reading, Pennsylvania. Residents explain how electric bills affect their budgets. Organizers prepare stories the residents have agreed to share so the city can consider ways to lower household bills.</p>
    <div class="read-grid"><div class="guide-paths"><article><h2>Start with the household</h2><p>Write a fictional story or fill the empty fields with a sample. Attach the sample bill, choose permissions, and preview the record before submitting it for review.</p><a class="btn primary" href="#/write">Write a story ${arrow}</a></article><article><h2>Open the organizer’s desk</h2><p>Start with the Reading sample case or a story you entered. Compare the original with the recipient copy, ask for a revision, or approve an eligible copy and download its packet.</p><a class="btn secondary" href="#/desk">Review a case ${arrow}</a></article></div>
    <div class="guide-aside"><h2>About this workspace</h2><details open><summary>Who can see a story?</summary><p>The participant chooses private review, recipient sharing and public reuse separately. Name and bill permissions control what the app includes in a recipient packet.</p></details><details><summary>What happens on this device?</summary><p>The preview saves fictional entries in this browser when storage is available. Simulated delivery records a local event. Use Reset demo in the footer to start again.</p></details><details><summary>What needs discovery?</summary><p>A live pilot would need verified recipients, authenticated roles, retention rules, secure storage and a tested delivery channel. Those decisions belong in the discovery plan.</p></details><details><summary>Where is the code?</summary><p>The source reader includes the actual files used by this preview. <a href="#/source">Inspect the source and tests</a>.</p></details></div></div></section>`;
  }
  function sourceReader() {
    const files = window.RECORD_SOURCE;
    const selectOptions = Object.entries(files)
      .map(
        ([name, item]) =>
          `<option value="${esc(name)}">${esc(item.title)} — ${esc(name)}</option>`,
      )
      .join("");
    host.innerHTML = `<section class="source-page"><p class="eyebrow">Implementation</p><h1>The source reader.</h1><p class="read-intro">Inspect the browser code that prepares a case for review and decides which fields can leave the original record.</p><label class="source-picker"><strong>Source file</strong><select>${selectOptions}</select></label>
    <div class="code-top"><h2 id="code-name"></h2><div class="actions resource-actions"><button class="btn secondary" id="wrap" aria-pressed="false">Wrap lines</button><button class="btn secondary" id="copy">Copy code</button><button class="btn secondary" id="save-file">Download file</button></div></div><p id="source-message" role="status"></p><pre class="code-viewport" tabindex="0" aria-label="Source code"><code></code></pre></section>`;
    const select = host.querySelector("select"),
      code = host.querySelector("code"),
      copy = host.querySelector("#copy"),
      wrap = host.querySelector("#wrap");
    const msg = host.querySelector("#source-message");
    function show() {
      code.textContent = files[select.value].text;
      host.querySelector("#code-name").textContent = select.value;
      host.querySelector("pre").scrollTop = 0;
      msg.textContent = files[select.value].summary;
      copy.textContent = "Copy code";
    }
    select.addEventListener("change", show);
    show();
    wrap.addEventListener("click", () =>
      wrap.setAttribute(
        "aria-pressed",
        String(host.querySelector("pre").classList.toggle("wrap")),
      ),
    );
    host.querySelector("#save-file").onclick = () =>
      download(files[select.value].text, select.value);
    copy.onclick = async () => {
      const name = select.value;
      try {
        await navigator.clipboard.writeText(files[name].text);
        if (select.value === name) {
          copy.textContent = "Copied";
          msg.textContent = name + " copied to clipboard.";
        }
      } catch {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(code);
        selection.removeAllRanges();
        selection.addRange(range);
        msg.textContent =
          "Code selected. Use your browser’s Copy command or Download file.";
      }
    };
  }
  function credits() {
    host.innerHTML = `<section class="guide-page"><p class="eyebrow">Credits</p><h1>Images &amp; type.</h1><div class="read-grid"><div><h2>Pennsylvania photograph</h2><p>The Common Ground edition illustrates the campaign with an aerial photograph of a Pittsburgh neighborhood.</p>
    <p><a href="https://www.loc.gov/item/2019690945/" target="_blank" rel="noreferrer">A neighborhood north of downtown Pittsburgh</a> · Carol M. Highsmith. Library of Congress.</p></div><div class="guide-aside"><h2>Typefaces</h2><p>Instrument Serif and DM Sans are included with the preview under the SIL Open Font License.</p><details><summary>Read font licenses</summary><pre class="license-text"></pre></details></div></div></section>`;
    host.querySelector(".license-text").textContent = window.RECORD_LICENSES;
  }
  function sectionFor(path) {
    const name = path.split("/")[1];
    if (
      ["write", "permissions", "preview", "receipt", "stories"].includes(name)
    )
      return "stories";
    if (["desk", "review", "packet"].includes(name)) return "desk";
    return { guide: "guide", source: "source", "": "campaign" }[name] || "";
  }
  function render(moveFocus = false) {
    const path = route(),
      section = sectionFor(path);
    document.documentElement.dataset.edition = edition;
    document.querySelectorAll("[data-section]").forEach((link) => {
      if (link.dataset.section === section)
        link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    if (section === "campaign") renderCampaign();
    else if (section === "stories") Participant.render(host, path);
    else if (section === "desk") Desk.render(host, path);
    else if (section === "guide") guide();
    else if (section === "source") sourceReader();
    else if (path === "/credits") credits();
    else
      host.innerHTML =
        '<section class="page"><h1>Page unavailable</h1><a href="#/">Return to the campaign</a></section>';
    if (Book.notice() && !host.textContent.includes(Book.notice())) {
      const msg = document.createElement("p");
      msg.className = "storage-banner";
      msg.textContent =
        Book.notice() ||
        "This browser cannot save your work. Keep this tab open while you explore.";
      host.prepend(msg);
    }
    document.title =
      (host.querySelector("h1")?.innerText.replace(/\s+/g, " ") || "Campaign") +
      " · Household Record";
    if (moveFocus) {
      host.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
  }
  function syncEditions() {
    document.documentElement.dataset.edition = edition;
    editionSelect.value = edition;
    picker
      .querySelectorAll("button")
      .forEach((button) =>
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.id === edition),
        ),
      );
  }
  function choose(id) {
    if (!isEdition(id) || id === edition) return;
    edition = id;
    try {
      localStorage.setItem(storedEditionKey, id);
    } catch {}
    syncEditions();
    // Task screens preserve their exact form controls and live edits when restyled.
    if (route() === "/") renderCampaign();
    status.textContent =
      editions.find((item) => item.id === id).name + " edition selected.";
  }
  for (const item of editions) {
    const option = new Option(item.name, item.id);
    editionSelect.add(option);
    const button = document.createElement("button");
    button.className = "edition-button";
    button.type = "button";
    button.dataset.id = item.id;
    button.innerHTML = `<span class="swatch ${item.id}" style="--chip:${item.color}" aria-hidden="true"></span>${esc(item.name)}`;
    button.onclick = () => choose(item.id);
    picker.append(button);
  }
  editionSelect.onchange = () => choose(editionSelect.value);
  const dialog = document.querySelector("#reset-dialog");
  document.querySelector("#reset").onclick = () => {
    dialog.returnValue = "";
    dialog.showModal();
  };
  dialog.addEventListener("close", () => {
    if (dialog.returnValue === "reset") {
      Book.reset();
      go("/");
      status.textContent = "Workspace reset. The sample case is ready.";
    }
  });
  document.querySelector(".skip").addEventListener("click", (event) => {
    event.preventDefault();
    host.focus();
    host.scrollIntoView();
  });
  window.addEventListener("hashchange", () => render(true));
  syncEditions();
  render();
})();

</script>
</body></html>
