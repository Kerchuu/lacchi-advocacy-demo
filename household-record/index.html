   const savedDraft = Book.hasDraft();\n    const rows = records.map(\n      (record) => `\u003cli>\u003ca href=\"${idPath(\"receipt\", record.id)}\">\n      \u003cdiv>\u003cstrong>${esc(record.name)}\u003c/strong>\u003csmall>${esc(record.city)}, Pennsylvania\u003c/small>\u003c/div>\n      \u003cspan class=\"folio-state\">${esc(statusLabel[record.status])}\u003c/span>\u003cspan class=\"folio-row-cue\" aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/li>`,\n    );\n    host.innerHTML = `\u003cdiv class=\"page folio-page\">\u003cheader class=\"page-head\">\u003ch1>My stories\u003c/h1>\n        \u003cp>Find the stories and organizer responses saved in this demo.\u003c/p>\u003c/header>\n      ${savedDraft ? `\u003csection class=\"folio-draft-row\">\u003cdiv>\u003ch2>Unfinished ${draft.revisionId ? \"revision\" : \"story\"}\u003c/h2>\u003cp>${esc(draft.name || \"Draft in this browser\")}\u003c/p>\u003c/div>\u003ca class=\"btn secondary\" href=\"#/write\">Continue draft\u003c/a>\u003c/section>` : \"\"}\n      \u003cdiv class=\"folio-section-head\">\u003ch2>Submitted stories\u003c/h2>${!savedDraft ? '\u003ca href=\"#/write\" class=\"btn primary\">Write a story\u003c/a>' : \"\"}\u003c/div>\n      ${rows.length ? `\u003cul class=\"folio-records\">${rows.join(\"\")}\u003c/ul>` : '\u003cp class=\"folio-empty\">Your submitted stories will appear here. Start with a fictional household account.\u003c/p>'}\n    \u003c/div>`;\n  }\n\n  function receipt(host, id) {\n    const record = Book.getRecord(id);\n    if (!record)\n      return actionState(\n        host,\n        \"Story unavailable\",\n        \"This entry could not be found in the current browser workspace.\",\n        \"#/stories\",\n        \"View my stories\",\n      );\n    const copy = {\n      \"in-review\":\n        \"An organizer can now read this entry and its sharing choices.\",\n      \"changes-requested\":\n        \"Read the organizer’s feedback below, then revise the story.\",\n      approved:\n        \"The organizer approved a recipient copy using your sharing choices.\",\n    };\n    host.innerHTML = `\u003cdiv class=\"page folio-page\">\u003ca class=\"folio-back\" href=\"#/stories\">← My stories\u003c/a>\n      \u003cheader class=\"page-head\">\u003cp class=\"eyebrow\">Participant copy · ${esc(dateLabel(record.createdAt))}\u003c/p>\n        \u003ch1>${esc(statusLabel[record.status])}\u003c/h1>\u003cp>${esc(copy[record.status])}\u003c/p>\u003c/header>\n      ${record.note ? `\u003csection class=\"folio-note\">\u003ch2>Organizer feedback\u003c/h2>\u003cp>${esc(record.note)}\u003c/p>\u003c/section>` : \"\"}\n      \u003cdiv class=\"folio-grid\">${manuscript(record, \"Your submitted story\", record.original)}\n        \u003caside class=\"folio-support\">\u003ch2>Sharing choices\u003c/h2>${shareSummary(record)}\u003c/aside>\n        \u003cdiv class=\"folio-next\">\u003cdiv class=\"actions\">\n          ${\n            record.status === \"changes-requested\"\n              ? `\u003cbutton type=\"button\" class=\"btn primary\" data-revise>Revise my story\u003c/button>\u003ca class=\"folio-text-action\" href=\"${idPath(\"review\", record.id)}\">Open organizer review\u003c/a>`\n              : `\u003ca class=\"btn primary\" href=\"${idPath(\"review\", record.id)}\">Open organizer review\u003c/a>\u003cbutton type=\"button\" class=\"btn secondary\" data-revise>Revise my story\u003c/button>`\n          }\n        \u003c/div>\u003cp class=\"folio-hint\">Both roles in this demo share the same browser workspace.\u003c/p>\n        \u003csection class=\"folio-confirm\" data-confirm hidden aria-labelledby=\"replace-question\">\u003ch2 id=\"replace-question\" tabindex=\"-1\">Replace the unfinished draft?\u003c/h2>\u003cp>Starting this revision will replace the current draft. Your submitted stories will stay in the workspace.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"btn secondary\" data-keep>Keep current draft\u003c/button>\u003cbutton type=\"button\" class=\"btn primary\" data-replace>Replace draft\u003c/button>\u003c/div>\u003c/section>\n        \u003cp class=\"folio-live\" role=\"status\" data-feedback>\u003c/p>\u003c/div>\n      \u003c/div>\u003c/div>`;\n\n    const confirm = host.querySelector(\"[data-confirm]\");\n    const revise = host.querySelector(\"[data-revise]\");\n    function startRevision(replace) {\n      try {\n        Book.revise(record.id, replace);\n        App.go(\"/write\");\n      } catch (error) {\n        setFeedback(host, error.message);\n      }\n    }\n    revise.addEventListener(\"click\", () => {\n      if (Book.hasDraft() && Book.get().draft.revisionId !== record.id) {\n        confirm.hidden = false;\n        host.querySelector(\"#replace-question\").focus();\n      } else startRevision(false);\n    });\n    host.querySelector(\"[data-keep]\").addEventListener(\"click\", () => {\n      confirm.hidden = true;\n      revise.focus();\n    });\n    host\n      .querySelector(\"[data-replace]\")\n      .addEventListener(\"click\", () => startRevision(true));\n  }\n\n  window.Participant = {\n    render(host, route) {\n      if (route === \"/write\") return write(host);\n      if (route === \"/permissions\") return permissions(host);\n      if (route === \"/preview\") return preview(host);\n      if (route === \"/stories\") return stories(host);\n      if (route.startsWith(\"/receipt/\")) {\n        let id;\n        try {\n          id = decodeURIComponent(route.slice(\"/receipt/\".length));\n        } catch {\n          id = \"\";\n        }\n        return receipt(host, id);\n      }\n      return actionState(\n        host,\n        \"Story unavailable\",\n        \"Choose a story from the current workspace.\",\n        \"#/stories\",\n        \"View my stories\",\n      );\n    },\n  };\n})();\n"},"desk.js":{"title":"Organizer pages","summary":"Queue filters, recipient copies, feedback and approved packets.","text":"/* The organizer works on a recipient copy. The participant's original stays\n   visible during editing, and the model checks permission again at export. */\n(() => {\n  \"use strict\";\n\n  const labels = {\n    \"in-review\": \"In review\",\n    \"changes-requested\": \"Changes requested\",\n    approved: \"Approved\",\n  };\n  const filters = { all: \"All stories\", ...labels };\n  let selectedFilter = \"all\";\n  const dateFormat = new Intl.DateTimeFormat(\"en-US\", {\n    month: \"short\",\n    day: \"numeric\",\n    year: \"numeric\",\n  });\n  const timeFormat = new Intl.DateTimeFormat(\"en-US\", {\n    month: \"short\",\n    day: \"numeric\",\n    hour: \"numeric\",\n    minute: \"2-digit\",\n  });\n\n  const escape = (value) => App.esc(String(value ?? \"\"));\n  const routeTo = (page, id) => \"#/\" + page + \"/\" + encodeURIComponent(id);\n  const statusMark = (status) =>\n    `\u003cspan class=\"desk-state\" data-state=\"${escape(status)}\">\u003ci aria-hidden=\"true\">\u003c/i>${escape(labels[status] || status)}\u003c/span>`;\n  const backLink = (href, label) =>\n    `\u003ca class=\"desk-back\" href=\"${href}\">\u003cspan aria-hidden=\"true\">←\u003c/span>${label}\u003c/a>`;\n  const alertArea =\n    '\u003cp class=\"desk-feedback\" role=\"alert\" data-error hidden>\u003c/p>';\n\n  function warn(host, error) {\n    const target = host.querySelector(\"[data-error]\");\n    target.hidden = false;\n    target.textContent =\n      error.message ||\n      \"This action could not be completed. Reopen the case and try again.\";\n  }\n\n  function notFound(host, packet = false) {\n    host.innerHTML = `\u003csection class=\"page desk-page\">\u003cheader class=\"page-head\">\n      \u003cp class=\"eyebrow\">Organizer desk\u003c/p>\u003ch1>${packet ? \"Packet unavailable\" : \"Story unavailable\"}\u003c/h1>\n      \u003cp>This case could not be found in this browser. Open the desk to see the stories available here.\u003c/p>\u003c/header>\n      \u003ca class=\"btn primary\" href=\"#/desk\">Open organizer desk\u003c/a>\u003c/section>`;\n  }\n\n  function queue(host) {\n    const records = Book.get().records;\n    const counts = Object.fromEntries(\n      Object.keys(filters).map((key) => [\n        key,\n        key === \"all\"\n          ? records.length\n          : records.filter((record) => record.status === key).length,\n      ]),\n    );\n    host.innerHTML = `\u003csection class=\"page desk-page\">\n      \u003cheader class=\"page-head desk-head\">\u003cp class=\"eyebrow\">Organizer workspace\u003c/p>\n        \u003ch1>Review desk\u003c/h1>\u003cp>Check what each resident agreed to share before preparing a story for the city’s energy bill study.\u003c/p>\u003c/header>\n      \u003csection class=\"desk-ledger\" aria-label=\"Submitted stories\">\n        \u003cdiv class=\"desk-filters\" role=\"group\" aria-label=\"Filter stories by review status\">\n          ${Object.entries(filters)\n            .map(\n              ([key, label]) =>\n                `\u003cbutton type=\"button\" data-filter=\"${key}\" aria-pressed=\"${key === selectedFilter}\">${label}\u003cspan aria-hidden=\"true\">${counts[key]}\u003c/span>\u003c/button>`,\n            )\n            .join(\"\")}\n        \u003c/div>\n        \u003cp class=\"desk-sr\" aria-live=\"polite\" data-count>\u003c/p>\n        \u003cdiv data-rows>\u003c/div>\n      \u003c/section>\u003c/section>`;\n\n    function drawRows() {\n      const visible = records.filter(\n        (item) => selectedFilter === \"all\" || item.status === selectedFilter,\n      );\n      host.querySelector(\"[data-count]\").textContent =\n        visible.length +\n        \" \" +\n        (visible.length === 1 ? \"story shown.\" : \"stories shown.\");\n      const rows = host.querySelector(\"[data-rows]\");\n      if (!visible.length) {\n        const all = selectedFilter === \"all\";\n        rows.innerHTML = `\u003cdiv class=\"desk-empty\">\u003ch2>${all ? \"The desk is empty\" : \"No stories in this view\"}\u003c/h2>\n          \u003cp>${all ? \"Submit a fictional story to bring it here for review.\" : \"Choose another status or return to all stories.\"}\u003c/p>\n          ${all ? '\u003ca class=\"btn secondary\" href=\"#/write\">Write a story\u003c/a>' : '\u003cbutton type=\"button\" class=\"btn secondary\" data-show-all>Show all stories\u003c/button>'}\u003c/div>`;\n        rows.querySelector(\"[data-show-all]\")?.addEventListener(\"click\", () => {\n          const allFilter = host.querySelector('[data-filter=\"all\"]');\n          allFilter.click();\n          allFilter.focus();\n        });\n        return;\n      }\n      rows.innerHTML = `\u003cdiv class=\"desk-column-labels\" aria-hidden=\"true\">\u003cspan>Household\u003c/span>\u003cspan>Submitted\u003c/span>\u003cspan>Review status\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n        \u003cul class=\"desk-rows\">${visible\n          .map(\n            (\n              item,\n            ) => `\u003cli>\u003ca class=\"desk-row\" href=\"${routeTo(\"review\", item.id)}\">\n          \u003cspan class=\"desk-person\">\u003cstrong>${escape(item.name)}\u003c/strong>\u003cspan>${escape(item.city)} · ${escape(item.id)}\u003c/span>\u003c/span>\n          \u003ctime datetime=\"${escape(item.createdAt)}\">${dateFormat.format(new Date(item.createdAt))}\u003c/time>\n          ${statusMark(item.status)}\u003cspan class=\"desk-row-arrow\" aria-hidden=\"true\">↗\u003c/span>\n          \u003cspan class=\"desk-sr\">Open case\u003c/span>\u003c/a>\u003c/li>`,\n          )\n          .join(\"\")}\u003c/ul>`;\n    }\n    for (const button of host.querySelectorAll(\"[data-filter]\")) {\n      button.addEventListener(\"click\", () => {\n        selectedFilter = button.dataset.filter;\n        for (const sibling of host.querySelectorAll(\"[data-filter]\")) {\n          sibling.setAttribute(\"aria-pressed\", String(sibling === button));\n        }\n        drawRows();\n      });\n    }\n    drawRows();\n  }\n\n  function permissionList(record) {\n    const permits = record.privateOK && record.recipientOK;\n    const pairs = [\n      [\"Organizer review\", record.privateOK ? \"Allowed\" : \"Withheld\"],\n      [\"Recipient copy\", permits ? \"Allowed\" : \"Withheld\"],\n      [\"Participant name\", permits && record.nameOK ? \"Included\" : \"Withheld\"],\n      [\n        \"Sample bill\",\n        permits && record.attached && record.docOK ? \"Included\" : \"Excluded\",\n      ],\n      [\"Public reuse\", record.publicOK ? \"Allowed\" : \"Withheld\"],\n    ];\n    return `\u003cdl class=\"desk-permissions\">${pairs.map(([label, value]) => `\u003cdiv>\u003cdt>${label}\u003c/dt>\u003cdd>${value}\u003c/dd>\u003c/div>`).join(\"\")}\u003c/dl>`;\n  }\n\n  function decision(record) {\n    if (Book.canExport(record)) {\n      return `\u003ca class=\"btn primary\" href=\"${routeTo(\"packet\", record.id)}\">Open approved packet \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>`;\n    }\n    if (record.status === \"changes-requested\") {\n      return `\u003cp class=\"desk-decision-note\">Waiting for a revised story.\u003c/p>\u003ca class=\"desk-text-link\" href=\"${routeTo(\"receipt\", record.id)}\">Open participant receipt \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>`;\n    }\n    if (!record.privateOK || !record.recipientOK) {\n      return '\u003cp class=\"desk-decision-note\">The participant withheld recipient sharing. This story stays in the review desk.\u003c/p>';\n    }\n    return `\u003cbutton class=\"btn primary\" type=\"button\" data-approve ${Book.canApprove(record) ? \"\" : \"disabled\"}>Approve recipient copy \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/button>\n      ${record.copy.trim() ? \"\" : '\u003cp class=\"desk-decision-note\">Enter a recipient copy before approving.\u003c/p>'}`;\n  }\n\n  function review(host, id) {\n    const record = Book.getRecord(id);\n    if (!record) return notFound(host);\n    const noteDraft = Book.get().reviewDrafts[id] || \"\";\n    host.innerHTML = `\u003csection class=\"page desk-page\">\n      ${backLink(\"#/desk\", \"Review desk\")}\n      \u003cheader class=\"page-head desk-head\">\u003cdiv class=\"desk-case-meta\">\u003cp class=\"eyebrow\">Case ${escape(record.id)}\u003c/p>\u003cspan data-case-status>${statusMark(record.status)}\u003c/span>\u003c/div>\n        \u003ch1>${escape(record.name)}\u003c/h1>\u003cp>${escape(record.city)} · Submitted ${dateFormat.format(new Date(record.createdAt))}\u003c/p>\u003c/header>\n      ${alertArea}\n      \u003cdiv class=\"desk-layout desk-review-layout\">\n        \u003carticle class=\"desk-section desk-source\">\u003ch2>Original story\u003c/h2>\n          \u003cblockquote>${escape(record.original)}\u003c/blockquote>\n          ${record.attached ? '\u003cdetails class=\"desk-disclosure\">\u003csummary>View attached sample bill\u003c/summary>\u003cpre class=\"desk-document\" data-bill>\u003c/pre>\u003c/details>' : \"\"}\n          ${\n            record.versions?.length\n              ? `\u003cdetails class=\"desk-disclosure\">\u003csummary>Earlier participant versions\u003c/summary>\n            ${[...record.versions]\n              .reverse()\n              .map(\n                (version) =>\n                  `\u003cdiv class=\"desk-version\">\u003ctime datetime=\"${escape(version.at)}\">${timeFormat.format(new Date(version.at))}\u003c/time>\u003cp>${escape(version.story)}\u003c/p>\u003c/div>`,\n              )\n              .join(\"\")}\u003c/details>`\n              : \"\"\n          }\n        \u003c/article>\n        \u003caside class=\"desk-rail\" aria-label=\"Participant permissions\">\n          \u003csection class=\"desk-file\">\u003ch2>Sharing choices\u003c/h2>${permissionList(record)}\u003c/section>\n          \u003cdetails class=\"desk-disclosure desk-history\">\u003csummary>Case history\u003c/summary>\u003cdiv data-history>${historyList(record)}\u003c/div>\u003c/details>\n        \u003c/aside>\n        \u003csection class=\"desk-section desk-copy-section\">\u003ch2>Recipient copy\u003c/h2>\n          \u003cp id=\"desk-copy-help\">Remove private details from the text before approval. The original stays on file.\u003c/p>\n          \u003clabel class=\"desk-sr\" for=\"desk-copy\">Edit recipient copy\u003c/label>\n          \u003ctextarea id=\"desk-copy\" class=\"desk-input\" rows=\"5\" aria-describedby=\"desk-copy-help\">${escape(record.copy)}\u003c/textarea>\n          \u003cbutton class=\"desk-restore\" type=\"button\" data-restore ${record.copy === record.original ? \"hidden\" : \"\"}>Restore original text\u003c/button>\n          \u003cp class=\"desk-save\" role=\"status\" data-save-copy>\u003c/p>\u003cdiv data-decision class=\"desk-decision\">${decision(record)}\u003c/div>\n        \u003c/section>\n        \u003csection class=\"desk-section desk-notes-section\">\u003ch2>Participant feedback\u003c/h2>\n          ${record.note ? `\u003cdiv class=\"desk-previous-note\">\u003cstrong>Last request\u003c/strong>\u003cp>${escape(record.note)}\u003c/p>\u003c/div>` : \"\"}\n          \u003clabel for=\"desk-note\">What should the participant change?\u003c/label>\n          \u003ctextarea id=\"desk-note\" class=\"desk-input\" rows=\"3\" aria-describedby=\"desk-note-help\">${escape(noteDraft)}\u003c/textarea>\n          \u003cp class=\"desk-note-help\" id=\"desk-note-help\">Feedback stays private until you request changes. The participant can then read it on their receipt.\u003c/p>\n          \u003cp class=\"desk-feedback\" id=\"desk-note-error\" hidden>\u003c/p>\n          \u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"btn secondary\" data-request>Request changes\u003c/button>\u003c/div>\n          \u003cp role=\"status\" class=\"desk-save\" data-feedback-saved>\u003c/p>\n        \u003c/section>\n      \u003c/div>\u003c/section>`;\n    if (record.attached)\n      host.querySelector(\"[data-bill]\").textContent = Book.sampleBill;\n    const editor = host.querySelector(\"#desk-copy\");\n    const note = host.querySelector(\"#desk-note\");\n    const saved = host.querySelector(\"[data-save-copy]\");\n    const noteError = host.querySelector(\"#desk-note-error\");\n    const decisionArea = host.querySelector(\"[data-decision]\");\n    const restore = host.querySelector(\"[data-restore]\");\n\n    // The editor stays mounted while the approval controls update so typing\n    // preserves the insertion point and immediately withdraws a stale packet.\n    function sync(next) {\n      host.querySelector(\"[data-case-status]\").innerHTML = statusMark(\n        next.status,\n      );\n      decisionArea.innerHTML = decision(next);\n      host.querySelector(\"[data-history]\").innerHTML = historyList(next);\n    }\n    editor.addEventListener(\"input\", () => {\n      try {\n        const previous = Book.getRecord(id);\n        const next = Book.editCopy(id, editor.value);\n        restore.hidden = next.copy === next.original;\n        if (\n          previous.status !== next.status ||\n          Boolean(previous.copy.trim()) !== Boolean(next.copy.trim())\n        )\n          sync(next);\n        const invalidated =\n          previous.status === \"approved\" && next.status !== \"approved\";\n        if (invalidated) saved.dataset.reapproval = \"true\";\n        saved.textContent = saved.dataset.reapproval\n          ? \"Copy changed. A new approval is required.\"\n          : Book.storageOK()\n            ? \"Copy saved in this browser.\"\n            : \"Copy kept in this tab until it closes.\";\n      } catch (error) {\n        warn(host, error);\n      }\n    });\n    restore.addEventListener(\"click\", () => {\n      if (\n        !window.confirm(\n          \"Replace the edited recipient copy with the participant’s original text?\",\n        )\n      )\n        return;\n      editor.value = Book.getRecord(id).original;\n      editor.dispatchEvent(new Event(\"input\"));\n      editor.focus();\n    });\n    decisionArea.addEventListener(\"click\", (event) => {\n      if (!event.target.closest(\"[data-approve]\")) return;\n      try {\n        Book.approve(id);\n        App.go(\"/packet/\" + encodeURIComponent(id));\n      } catch (error) {\n        warn(host, error);\n      }\n    });\n    note.addEventListener(\"input\", () => {\n      try {\n        Book.saveNote(id, note.value);\n        if (note.value.trim()) {\n          noteError.hidden = true;\n          note.removeAttribute(\"aria-invalid\");\n          note.setAttribute(\"aria-describedby\", \"desk-note-help\");\n        }\n      } catch (error) {\n        warn(host, error);\n      }\n    });\n    host.querySelector(\"[data-request]\").addEventListener(\"click\", () => {\n      if (!note.value.trim()) {\n        noteError.textContent = \"Write a request for the participant first.\";\n        noteError.hidden = false;\n        note.setAttribute(\"aria-invalid\", \"true\");\n        note.setAttribute(\"aria-describedby\", \"desk-note-error desk-note-help\");\n        note.focus();\n        return;\n      }\n      try {\n        Book.requestChanges(id, note.value);\n        review(host, id);\n        const result = host.querySelector(\"[data-feedback-saved]\");\n        result.textContent =\n          \"Changes requested. The feedback is on the participant’s receipt.\";\n        const receipt =\n          host.querySelector(\"[data-decision] a\") ||\n          host.querySelector(\"[data-request]\");\n        receipt.focus();\n      } catch (error) {\n        warn(host, error);\n      }\n    });\n  }\n\n  function historyList(record) {\n    const entries = [...record.history].reverse();\n    if (!entries.length) return \"\u003cp>No changes recorded yet.\u003c/p>\";\n    return `\u003col class=\"desk-events\">${entries\n      .map(\n        (entry) => `\u003cli>\u003cspan>${escape(entry.text)}\u003c/span>\n      \u003ctime datetime=\"${escape(entry.at)}\">${timeFormat.format(new Date(entry.at))}\u003c/time>\u003c/li>`,\n      )\n      .join(\"\")}\u003c/ol>`;\n  }\n\n  function deliveryLog(record) {\n    if (!record.log.length)\n      return '\u003cp class=\"desk-log-note\">No simulation recorded.\u003c/p>';\n    return `\u003col class=\"desk-events\">${record.log\n      .map(\n        (entry) => `\u003cli>${escape(entry.text)}\n      \u003ctime datetime=\"${escape(entry.at)}\">${timeFormat.format(new Date(entry.at))}\u003c/time>\u003c/li>`,\n      )\n      .join(\"\")}\u003c/ol>`;\n  }\n\n  function packet(host, id) {\n    const record = Book.getRecord(id);\n    if (!record) return notFound(host, true);\n    const back = backLink(routeTo(\"review\", id), \"Case review\");\n    if (!Book.canExport(record)) {\n      host.innerHTML = `\u003csection class=\"page desk-page\">${back}\u003cheader class=\"page-head\">\u003cp class=\"eyebrow\">Case ${escape(id)}\u003c/p>\n        \u003ch1>Packet unavailable\u003c/h1>\u003cp>The current copy needs recipient permission and organizer approval before it can be downloaded.\u003c/p>\u003c/header>\n        \u003ca class=\"btn primary\" href=\"${routeTo(\"review\", id)}\">Review this case\u003c/a>\u003c/section>`;\n      return;\n    }\n    host.innerHTML = `\u003csection class=\"page desk-page\">${back}\n      \u003cheader class=\"page-head desk-head\">\u003cdiv class=\"desk-case-meta\">\u003cp class=\"eyebrow\">Case ${escape(id)}\u003c/p>${statusMark(record.status)}\u003c/div>\n        \u003ch1>Recipient packet\u003c/h1>\u003cp>Download the approved text and the details this participant agreed to share.\u003c/p>\u003c/header>\n      ${alertArea}\n      \u003cdiv class=\"desk-layout desk-packet-layout\">\u003cdiv class=\"desk-content\">\n        \u003cdiv class=\"desk-packet-tools\">\u003cbutton type=\"button\" class=\"btn primary\" data-download>Download packet \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/button>\n          \u003cspan>Plain text · .txt\u003c/span>\u003c/div>\n        \u003cp role=\"status\" class=\"desk-save\" data-downloaded>\u003c/p>\n        \u003csection class=\"desk-paper\">\u003ch2>Packet contents\u003c/h2>\u003cpre class=\"desk-document\" data-preview>\u003c/pre>\u003c/section>\n      \u003c/div>\u003cdiv class=\"desk-rail\">\n        \u003csection class=\"desk-file\" aria-labelledby=\"desk-rehearsal\">\u003ch2 id=\"desk-rehearsal\">Delivery rehearsal\u003c/h2>\n          \u003cp>This records a trial delivery in your browser. Nothing is sent to a recipient.\u003c/p>\n          \u003cbutton type=\"button\" class=\"btn secondary\" data-simulate ${record.log.length ? \"disabled\" : \"\"}>${record.log.length ? \"Simulation recorded\" : \"Simulate delivery\"}\u003c/button>\n          \u003cdiv data-log class=\"desk-log\" aria-live=\"polite\">${deliveryLog(record)}\u003c/div>\n        \u003c/section>\u003c/div>\u003c/div>\u003c/section>`;\n    // Display the exact bytes used for the download. The packet formatter is\n    // the single place that decides which fields may leave the review desk.\n    const preview = host.querySelector(\"[data-preview]\");\n    preview.textContent = Book.packet(id);\n    host.querySelector(\"[data-download]\").addEventListener(\"click\", () => {\n      try {\n        const current = Book.packet(id);\n        if (current !== preview.textContent) {\n          packet(host, id);\n          host.querySelector(\"[data-downloaded]\").textContent =\n            \"The approved packet changed. Read the updated contents before downloading.\";\n          return;\n        }\n        App.download(current, \"household-record-\" + id + \".txt\");\n        host.querySelector(\"[data-downloaded]\").textContent =\n          \"Text file prepared for download.\";\n      } catch (error) {\n        warn(host, error);\n      }\n    });\n    const simulate = host.querySelector(\"[data-simulate]\");\n    simulate.addEventListener(\"click\", () => {\n      try {\n        const next = Book.simulate(id);\n        simulate.textContent = \"Simulation recorded\";\n        simulate.disabled = true;\n        host.querySelector(\"[data-log]\").innerHTML = deliveryLog(next);\n      } catch (error) {\n        warn(host, error);\n      }\n    });\n  }\n\n  window.Desk = {\n    render(host, route) {\n      const [, page, id] = route.split(\"/\");\n      if (page === \"desk\") return queue(host);\n      return page === \"review\" ? review(host, id) : packet(host, id);\n    },\n  };\n})();\n"},"exhibit.js":{"title":"Interactive campaign exhibits","summary":"How each edition presents the bill, the story and the sharing decision.","text":"/* Three views of one fictional case. The exhibit never reads the visitor's drafts. */\n(() => {\n  \"use strict\";\n  const views = [\"Bill\", \"Story\", \"Sharing\"];\n  const story =\n    \"When the next bill came in at $286, we split our grocery trip across two weeks.\";\n  const caseFile = \"FW-0101\";\n  let sequence = 0;\n\n  function choices() {\n    return '\u003cdl class=\"fx-permissions\">\u003cdiv>\u003cdt>Recipient copy\u003c/dt>\u003cdd>Allowed\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Contributor name\u003c/dt>\u003cdd>Withheld\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Sample bill\u003c/dt>\u003cdd>Excluded\u003c/dd>\u003c/div>\u003c/dl>';\n  }\n\n  function drawing(view) {\n    const header = [\n      \"Monthly charges\",\n      \"Participant account\",\n      \"Release schedule\",\n    ][view];\n    const detail = [\n      '\u003cdiv class=\"fx-plot\">\u003cdiv class=\"fx-axis\">\u003cspan>$300\u003c/span>\u003cspan>$150\u003c/span>\u003cspan>$0\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"fx-columns\">\u003cdiv class=\"fx-column fx-previous\">\u003cstrong>$178\u003c/strong>\u003ci>\u003c/i>\u003csmall>Previous\u003c/small>\u003c/div>' +\n        '\u003cdiv class=\"fx-column fx-current\">\u003cstrong>$286\u003c/strong>\u003ci>\u003c/i>\u003csmall>Current\u003c/small>\u003c/div>\u003c/div>\u003c/div>',\n      '\u003cdiv class=\"fx-measured-text\">\u003cspan class=\"fx-tinytag\">Source / participant\u003c/span>\u003cblockquote>“' +\n        story +\n        \"”\u003c/blockquote>\u003c/div>\",\n      '\u003cdiv class=\"fx-register\">\u003cspan class=\"fx-tinytag\">Recipient packet\u003c/span>' +\n        choices() +\n        \"\u003c/div>\",\n    ][view];\n    const footer = [\n      \"\u003cspan>Change\u003c/span>\u003cstrong>+$108\u003c/strong>\",\n      \"\u003cspan>Community\u003c/span>\u003cstrong>Reading, PA\u003c/strong>\",\n      \"\u003cspan>Public reuse\u003c/span>\u003cstrong>Withheld\u003c/strong>\",\n    ][view];\n    return (\n      '\u003cdiv class=\"fx-art fx-drawing\">\u003cdiv class=\"fx-plan\">\u003cdiv class=\"fx-plan-head\">\u003cspan class=\"fx-tinytag\">Sample case / ' +\n      caseFile +\n      \"\u003c/span>\u003ch3>\" +\n      header +\n      \"\u003c/h3>\u003c/div>\" +\n      detail +\n      '\u003cdiv class=\"fx-plan-key\">' +\n      footer +\n      \"\u003c/div>\u003c/div>\u003c/div>\"\n    );\n  }\n\n  function journal(view) {\n    const detail = [\n      '\u003ch3>The monthly bill\u003c/h3>\u003cp class=\"fx-note-sum\">$178 \u003cspan>→\u003c/span> $286\u003c/p>\u003cp class=\"fx-note-line\">A $108 increase in one month.\u003c/p>',\n      '\u003ch3>In their words\u003c/h3>\u003cblockquote class=\"fx-excerpt\">“' +\n        story +\n        \"”\u003c/blockquote>\",\n      \"\u003ch3>What may travel\u003c/h3>\" + choices(),\n    ][view];\n    return (\n      '\u003cdiv class=\"fx-art fx-garden\">\u003cdiv class=\"fx-aerial\" aria-hidden=\"true\">\u003c/div>\u003carticle class=\"fx-fieldnote\">' +\n      '\u003cdiv class=\"fx-reference\">\u003cspan>Household notes\u003c/span>\u003cspan>' +\n      caseFile +\n      \"\u003c/span>\u003c/div>\" +\n      detail +\n      \"\u003c/article>\u003c/div>\"\n    );\n  }\n\n  function envelope(view) {\n    const detail = [\n      \"\u003ch3>A change\u003cbr>of \u003cem>$108.\u003c/em>\u003c/h3>\u003cp>$178 last month · $286 this month\u003c/p>\",\n      \"\u003ch3>Dear review team,\u003c/h3>\u003cblockquote>“\" + story + \"”\u003c/blockquote>\",\n      \"\u003ch3>Enclosure list\u003c/h3>\" + choices(),\n    ][view];\n    return (\n      '\u003cdiv class=\"fx-art fx-post fx-post-' +\n      view +\n      '\">\u003cdiv class=\"fx-envelope\">' +\n      '\u003cdiv class=\"fx-back\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"fx-letter\">\u003cdiv class=\"fx-reference\">Sample correspondence\u003c/div>' +\n      detail +\n      '\u003c/div>\u003cdiv class=\"fx-pocket\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003c/div>\u003cdiv class=\"fx-address\">\u003cspan>Household correspondence\u003c/span>\u003cb>' +\n      caseFile +\n      '\u003c/b>\u003c/div>\u003cdiv class=\"fx-postage\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003c/div>\u003c/div>\u003c/div>'\n    );\n  }\n\n  const renderers = {\n    blueprint: drawing,\n    garden: journal,\n    parade: envelope,\n  };\n\n  function render(host, edition) {\n    const draw = renderers[edition] || drawing;\n    const id = \"field-exhibit-\" + ++sequence;\n    const tab = (label, index) =>\n      '\u003cbutton type=\"button\" role=\"tab\" id=\"' +\n      id +\n      \"-tab-\" +\n      index +\n      '\" aria-controls=\"' +\n      id +\n      \"-panel-\" +\n      index +\n      '\" aria-selected=\"' +\n      (index === 0) +\n      '\" tabindex=\"' +\n      (index === 0 ? \"0\" : \"-1\") +\n      '\">' +\n      label +\n      \"\u003c/button>\";\n    const panel = (_, index) =>\n      '\u003cdiv role=\"tabpanel\" class=\"fx-panel\" tabindex=\"0\" id=\"' +\n      id +\n      \"-panel-\" +\n      index +\n      '\" aria-labelledby=\"' +\n      id +\n      \"-tab-\" +\n      index +\n      '\"' +\n      (index ? \" hidden\" : \"\") +\n      \">\" +\n      draw(index) +\n      \"\u003c/div>\";\n    host.innerHTML =\n      '\u003cdiv class=\"fx\">\u003cdiv class=\"fx-top\">\u003ch2 class=\"fx-label\">Sample exhibit\u003c/h2>' +\n      '\u003cdiv class=\"fx-tabs\" role=\"tablist\" aria-label=\"Sample exhibit\">' +\n      views.map(tab).join(\"\") +\n      \"\u003c/div>\u003c/div>\" +\n      views.map(panel).join(\"\") +\n      \"\u003c/div>\";\n    const tabs = [...host.querySelectorAll(\"[role=tab]\")];\n    const panels = [...host.querySelectorAll(\"[role=tabpanel]\")];\n    function select(index) {\n      tabs.forEach((button, i) => {\n        const active = i === index;\n        button.setAttribute(\"aria-selected\", String(active));\n        button.tabIndex = active ? 0 : -1;\n        panels[i].hidden = !active;\n      });\n    }\n    tabs.forEach((button, index) => {\n      button.addEventListener(\"click\", () => select(index));\n      button.addEventListener(\"keydown\", (event) => {\n        const destinations = {\n          ArrowRight: (index + 1) % tabs.length,\n          ArrowLeft: (index + tabs.length - 1) % tabs.length,\n          Home: 0,\n          End: tabs.length - 1,\n        };\n        if (!(event.key in destinations)) return;\n        event.preventDefault();\n        const next = destinations[event.key];\n        select(next);\n        tabs[next].focus();\n      });\n    });\n  }\n\n  globalThis.Exhibit = Object.freeze({ render });\n})();\n"},"app.js":{"title":"Navigation and resources","summary":"The standalone site’s routes, design editions, source reader and reset controls.","text":"(function householdRecord() {\n  const editions = [\n    { id: \"blueprint\", name: \"Blueprint\", color: \"#1852a5\" },\n    { id: \"garden\", name: \"Common Ground\", color: \"#5a7144\" },\n    { id: \"parade\", name: \"Paper Parade\", color: \"#b44756\" },\n  ];\n  const host = document.querySelector(\"#main\");\n  const status = document.querySelector(\"#app-status\");\n  const editionSelect = document.querySelector(\"#edition-select\");\n  const picker = document.querySelector(\"#editions\");\n  const storedEditionKey = \"lacchi-household-record-edition-v1\";\n  const isEdition = (value) => editions.some((item) => item.id === value);\n  let edition = editions[0].id;\n  try {\n    const saved = localStorage.getItem(storedEditionKey);\n    if (isEdition(saved)) edition = saved;\n    else if (saved !== null) localStorage.removeItem(storedEditionKey);\n  } catch {\n    /* The preview also works in browsers which block local storage. */\n  }\n  function esc(value) {\n    return String(value ?? \"\").replace(\n      /[&\u003c>\"']/g,\n      (char) =>\n        ({\n          \"&\": \"&amp;\",\n          \"\u003c\": \"&lt;\",\n          \">\": \"&gt;\",\n          '\"': \"&quot;\",\n          \"'\": \"&#39;\",\n        })[char],\n    );\n  }\n  function download(text, name) {\n    const address = URL.createObjectURL(\n      new Blob([text], { type: \"text/plain;charset=utf-8\" }),\n    );\n    const link = Object.assign(document.createElement(\"a\"), {\n      href: address,\n      download: name,\n    });\n    document.body.append(link);\n    link.click();\n    link.remove();\n    setTimeout(() => URL.revokeObjectURL(address), 2000);\n  }\n  function route() {\n    const path = location.hash.slice(1);\n    return path.startsWith(\"/\") ? path : \"/\";\n  }\n  function go(path) {\n    if (route() === path) render(true);\n    else location.hash = path;\n  }\n  window.App = Object.freeze({ esc, download, go });\n  const arrow = '\u003cspan class=\"arrow\" aria-hidden=\"true\">↗\u003c/span>';\n  const stageHeadlines = {\n    blueprint: \"Anatomy of\u003cbr>\u003cem>an energy bill.\u003c/em>\",\n    garden: \"What a home\u003cbr>\u003cem>runs on.\u003c/em>\",\n    parade: \"A letter from\u003cbr>\u003cem>our kitchen.\u003c/em>\",\n  };\n  function casebookStrip() {\n    const records = Book.get().records;\n    const pending = records.filter(\n      (record) => record.status === \"in-review\",\n    ).length;\n    const latest = records.find((record) => Book.canExport(record));\n    const draft = Book.hasDraft();\n    const cell = (label, text, href) =>\n      href\n        ? `\u003ca href=\"${esc(href)}\">\u003cspan>${esc(label)}\u003c/span>\u003cstrong>${esc(text)}\u003c/strong>\u003ci aria-hidden=\"true\">↗\u003c/i>\u003c/a>`\n        : `\u003cdiv class=\"ledger-cell\">\u003cspan>${esc(label)}\u003c/span>\u003cstrong>${esc(text)}\u003c/strong>\u003c/div>`;\n    return `\u003csection class=\"cover-foot\" aria-labelledby=\"casebook-title\">\u003cdiv class=\"path-heading\">\u003cp class=\"eyebrow\">Saved in this browser\u003c/p>\u003ch2 id=\"casebook-title\">Your casebook.\u003c/h2>\u003c/div>\n      \u003cdiv class=\"path-links\">${cell(\"Participant draft\", draft ? \"Continue your draft\" : \"No draft in progress\", draft ? \"#/write\" : null)}\n      ${cell(\"Organizer queue\", pending === 1 ? \"1 case in review\" : pending + \" cases in review\", \"#/desk\")}\n      ${cell(\"Recipient packet\", latest ? \"Open approved packet\" : \"Awaiting approval\", latest ? \"#/packet/\" + latest.id : null)}\u003c/div>\u003c/section>`;\n  }\n  function renderCampaign() {\n    const current = editions.find((item) => item.id === edition);\n    host.innerHTML = `\u003csection class=\"cover\" aria-labelledby=\"cover-title\">\n      \u003cdiv class=\"cover-copy\">\n        \u003cp class=\"issue-line\">\u003cspan class=\"issue-dash\">\u003c/span>Reading, Pennsylvania \u003cb aria-hidden=\"true\">/\u003c/b> City energy bill study\u003c/p>\n        \u003ch1 id=\"cover-title\">${stageHeadlines[edition]}\u003c/h1>\n        \u003cp class=\"standfirst\">This fictional city campaign studies what Reading households pay for electricity. Residents share bills and stories to help the city explore ways to lower those bills.\u003c/p>\n        \u003cdiv class=\"cover-actions\">\u003ca class=\"btn primary\" href=\"#/write\">${Book.hasDraft() ? \"Continue your story\" : \"Write a story\"} ${arrow}\u003c/a>\u003ca class=\"desk-link\" href=\"#/desk\">Open organizer desk \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\n        \u003cp class=\"cover-note\">\u003cspan aria-hidden=\"true\" class=\"note-dot\">\u003c/span>Use sample details. Your entries stay in this browser.\u003c/p>\n      \u003c/div>\u003cdiv class=\"exhibit\" aria-label=\"${esc(current.name)} campaign exhibit\">\u003c/div>\u003c/section>\n      ${casebookStrip()}`;\n    Exhibit.render(host.querySelector(\".exhibit\"), edition);\n  }\n  function guide() {\n    host.innerHTML = `\u003csection class=\"guide-page\">\u003cp class=\"eyebrow\">Demo guide\u003c/p>\u003ch1>Walk through a case.\u003c/h1>\u003cp class=\"read-intro\">This city energy bill study is a fictional campaign set in Reading, Pennsylvania. Residents explain how electric bills affect their budgets. Organizers prepare stories the residents have agreed to share so the city can consider ways to lower household bills.\u003c/p>\n    \u003cdiv class=\"read-grid\">\u003cdiv class=\"guide-paths\">\u003carticle>\u003ch2>Start with the household\u003c/h2>\u003cp>Write a fictional story or fill the empty fields with a sample. Attach the sample bill, choose permissions, and preview the record before submitting it for review.\u003c/p>\u003ca class=\"btn primary\" href=\"#/write\">Write a story ${arrow}\u003c/a>\u003c/article>\u003carticle>\u003ch2>Open the organizer’s desk\u003c/h2>\u003cp>Start with the Reading sample case or a story you entered. Compare the original with the recipient copy, ask for a revision, or approve an eligible copy and download its packet.\u003c/p>\u003ca class=\"btn secondary\" href=\"#/desk\">Review a case ${arrow}\u003c/a>\u003c/article>\u003c/div>\n    \u003cdiv class=\"guide-aside\">\u003ch2>About this workspace\u003c/h2>\u003cdetails open>\u003csummary>Who can see a story?\u003c/summary>\u003cp>The participant chooses private review, recipient sharing and public reuse separately. Name and bill permissions control what the app includes in a recipient packet.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What happens on this device?\u003c/summary>\u003cp>The preview saves fictional entries in this browser when storage is available. Simulated delivery records a local event. Use Reset demo in the footer to start again.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What needs discovery?\u003c/summary>\u003cp>A live pilot would need verified recipients, authenticated roles, retention rules, secure storage and a tested delivery channel. Those decisions belong in the discovery plan.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Where is the code?\u003c/summary>\u003cp>The source reader includes the actual files used by this preview. \u003ca href=\"#/source\">Inspect the source and tests\u003c/a>.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>`;\n  }\n  function sourceReader() {\n    const files = window.RECORD_SOURCE;\n    const selectOptions = Object.entries(files)\n      .map(\n        ([name, item]) =>\n          `\u003coption value=\"${esc(name)}\">${esc(item.title)} — ${esc(name)}\u003c/option>`,\n      )\n      .join(\"\");\n    host.innerHTML = `\u003csection class=\"source-page\">\u003cp class=\"eyebrow\">Implementation\u003c/p>\u003ch1>The source reader.\u003c/h1>\u003cp class=\"read-intro\">Inspect the browser code that prepares a case for review and decides which fields can leave the original record.\u003c/p>\u003clabel class=\"source-picker\">\u003cstrong>Source file\u003c/strong>\u003cselect>${selectOptions}\u003c/select>\u003c/label>\n    \u003cdiv class=\"code-top\">\u003ch2 id=\"code-name\">\u003c/h2>\u003cdiv class=\"actions resource-actions\">\u003cbutton class=\"btn secondary\" id=\"wrap\" aria-pressed=\"false\">Wrap lines\u003c/button>\u003cbutton class=\"btn secondary\" id=\"copy\">Copy code\u003c/button>\u003cbutton class=\"btn secondary\" id=\"save-file\">Download file\u003c/button>\u003c/div>\u003c/div>\u003cp id=\"source-message\" role=\"status\">\u003c/p>\u003cpre class=\"code-viewport\" tabindex=\"0\" aria-label=\"Source code\">\u003ccode>\u003c/code>\u003c/pre>\u003c/section>`;\n    const select = host.querySelector(\"select\"),\n      code = host.querySelector(\"code\"),\n      copy = host.querySelector(\"#copy\"),\n      wrap = host.querySelector(\"#wrap\");\n    const msg = host.querySelector(\"#source-message\");\n    function show() {\n      code.textContent = files[select.value].text;\n      host.querySelector(\"#code-name\").textContent = select.value;\n      host.querySelector(\"pre\").scrollTop = 0;\n      msg.textContent = files[select.value].summary;\n      copy.textContent = \"Copy code\";\n    }\n    select.addEventListener(\"change\", show);\n    show();\n    wrap.addEventListener(\"click\", () =>\n      wrap.setAttribute(\n        \"aria-pressed\",\n        String(host.querySelector(\"pre\").classList.toggle(\"wrap\")),\n      ),\n    );\n    host.querySelector(\"#save-file\").onclick = () =>\n      download(files[select.value].text, select.value);\n    copy.onclick = async () => {\n      const name = select.value;\n      try {\n        await navigator.clipboard.writeText(files[name].text);\n        if (select.value === name) {\n          copy.textContent = \"Copied\";\n          msg.textContent = name + \" copied to clipboard.\";\n        }\n      } catch {\n        const selection = window.getSelection();\n        const range = document.createRange();\n        range.selectNodeContents(code);\n        selection.removeAllRanges();\n        selection.addRange(range);\n        msg.textContent =\n          \"Code selected. Use your browser’s Copy command or Download file.\";\n      }\n    };\n  }\n  function credits() {\n    host.innerHTML = `\u003csection class=\"guide-page\">\u003cp class=\"eyebrow\">Credits\u003c/p>\u003ch1>Images &amp; type.\u003c/h1>\u003cdiv class=\"read-grid\">\u003cdiv>\u003ch2>Pennsylvania photograph\u003c/h2>\u003cp>The Common Ground edition illustrates the campaign with an aerial photograph of a Pittsburgh neighborhood.\u003c/p>\n    \u003cp>\u003ca href=\"https://www.loc.gov/item/2019690945/\" target=\"_blank\" rel=\"noreferrer\">A neighborhood north of downtown Pittsburgh\u003c/a> · Carol M. Highsmith. Library of Congress.\u003c/p>\u003c/div>\u003cdiv class=\"guide-aside\">\u003ch2>Typefaces\u003c/h2>\u003cp>Instrument Serif and DM Sans are included with the preview under the SIL Open Font License.\u003c/p>\u003cdetails>\u003csummary>Read font licenses\u003c/summary>\u003cpre class=\"license-text\">\u003c/pre>\u003c/details>\u003c/div>\u003c/div>\u003c/section>`;\n    host.querySelector(\".license-text\").textContent = window.RECORD_LICENSES;\n  }\n  function sectionFor(path) {\n    const name = path.split(\"/\")[1];\n    if (\n      [\"write\", \"permissions\", \"preview\", \"receipt\", \"stories\"].includes(name)\n    )\n      return \"stories\";\n    if ([\"desk\", \"review\", \"packet\"].includes(name)) return \"desk\";\n    return { guide: \"guide\", source: \"source\", \"\": \"campaign\" }[name] || \"\";\n  }\n  function render(moveFocus = false) {\n    const path = route(),\n      section = sectionFor(path);\n    document.documentElement.dataset.edition = edition;\n    document.querySelectorAll(\"[data-section]\").forEach((link) => {\n      if (link.dataset.section === section)\n        link.setAttribute(\"aria-current\", \"page\");\n      else link.removeAttribute(\"aria-current\");\n    });\n    if (section === \"campaign\") renderCampaign();\n    else if (section === \"stories\") Participant.render(host, path);\n    else if (section === \"desk\") Desk.render(host, path);\n    else if (section === \"guide\") guide();\n    else if (section === \"source\") sourceReader();\n    else if (path === \"/credits\") credits();\n    else\n      host.innerHTML =\n        '\u003csection class=\"page\">\u003ch1>Page unavailable\u003c/h1>\u003ca href=\"#/\">Return to the campaign\u003c/a>\u003c/section>';\n    if (Book.notice() && !host.textContent.includes(Book.notice())) {\n      const msg = document.createElement(\"p\");\n      msg.className = \"storage-banner\";\n      msg.textContent =\n        Book.notice() ||\n        \"This browser cannot save your work. Keep this tab open while you explore.\";\n      host.prepend(msg);\n    }\n    document.title =\n      (host.querySelector(\"h1\")?.innerText.replace(/\\s+/g, \" \") || \"Campaign\") +\n      \" · Household Record\";\n    if (moveFocus) {\n      host.focus({ preventScroll: true });\n      window.scrollTo(0, 0);\n    }\n  }\n  function syncEditions() {\n    document.documentElement.dataset.edition = edition;\n    editionSelect.value = edition;\n    picker\n      .querySelectorAll(\"button\")\n      .forEach((button) =>\n        button.setAttribute(\n          \"aria-pressed\",\n          String(button.dataset.id === edition),\n        ),\n      );\n  }\n  function choose(id) {\n    if (!isEdition(id) || id === edition) return;\n    edition = id;\n    try {\n      localStorage.setItem(storedEditionKey, id);\n    } catch {}\n    syncEditions();\n    // Task screens preserve their exact form controls and live edits when restyled.\n    if (route() === \"/\") renderCampaign();\n    status.textContent =\n      editions.find((item) => item.id === id).name + \" edition selected.\";\n  }\n  for (const item of editions) {\n    const option = new Option(item.name, item.id);\n    editionSelect.add(option);\n    const button = document.createElement(\"button\");\n    button.className = \"edition-button\";\n    button.type = \"button\";\n    button.dataset.id = item.id;\n    button.innerHTML = `\u003cspan class=\"swatch ${item.id}\" style=\"--chip:${item.color}\" aria-hidden=\"true\">\u003c/span>${esc(item.name)}`;\n    button.onclick = () => choose(item.id);\n    picker.append(button);\n  }\n  editionSelect.onchange = () => choose(editionSelect.value);\n  const dialog = document.querySelector(\"#reset-dialog\");\n  document.querySelector(\"#reset\").onclick = () => {\n    dialog.returnValue = \"\";\n    dialog.showModal();\n  };\n  dialog.addEventListener(\"close\", () => {\n    if (dialog.returnValue === \"reset\") {\n      Book.reset();\n      go(\"/\");\n      status.textContent = \"Workspace reset. The sample case is ready.\";\n    }\n  });\n  document.querySelector(\".skip\").addEventListener(\"click\", (event) => {\n    event.preventDefault();\n    host.focus();\n    host.scrollIntoView();\n  });\n  window.addEventListener(\"hashchange\", () => render(true));\n  syncEditions();\n  render();\n})();\n"}};

/* The participant and organizer share one fictional case file in this browser. */
(() => {
  "use strict";

  const storageKey = "lacchi-fieldwork-casebook-v1";
  const allowedStates = ["in-review", "changes-requested", "approved"];
  const textFields = ["name", "city", "story"];
  const choiceFields = [
    "attached",
    "privateOK",
    "recipientOK",
    "publicOK",
    "nameOK",
    "docOK",
  ];
  const sample = Object.freeze({
    name: "Rowan Ellis",
    city: "Reading",
    story:
      "Our electric bill went from $178 to $286. We put off replacing the tires on our car to cover it. A clearer explanation of the increase would help us plan for next month.",
  });
  const sampleBill = [
    "Sample electric bill · Fictional document",
    "Previous month  $178.00",
    "Current month   $286.00",
    "Change         +$108.00",
    "Prepared for this demonstration using fictional amounts.",
  ].join("\n");
  const now = () => new Date().toISOString();
  const clone = (value) => JSON.parse(JSON.stringify(value));
  const string = (value) => (typeof value === "string" ? value : "");

  function readDraft(source = {}) {
    const draft = { revisionId: string(source?.revisionId) || null };
    for (const field of textFields) draft[field] = string(source?.[field]);
    // A missing checkbox or a serialized string such as "true" never grants consent.
    for (const field of choiceFields) draft[field] = source?.[field] === true;
    return draft;
  }

  function validate(draft) {
    const errors = {};
    if (!string(draft?.name).trim()) errors.name = "Enter a fictional name.";
    if (!string(draft?.city).trim())
      errors.city = "Enter a Pennsylvania community.";
    if (!string(draft?.story).trim())
      errors.story = "Write a short story about the bill.";
    if (draft?.privateOK !== true)
      errors.privateOK = "Allow private organizer review to submit.";
    return errors;
  }

  function openRecord(fields, id, at) {
    return {
      ...readDraft(fields),
      revisionId: null,
      id,
      original: fields.story,
      copy: fields.story,
      status: "in-review",
      note: "",
      createdAt: at,
      updatedAt: at,
      approvedAt: null,
      history: [{ at, text: "Story submitted for private review." }],
      log: [],
      versions: [],
    };
  }

  function initial() {
    const example = {
      name: "Morgan Hale",
      city: "Reading",
      attached: true,
      privateOK: true,
      recipientOK: true,
      story:
        "We budgeted $178 for electricity. When the next bill came in at $286, we split our grocery trip across two weeks. I want the review team to know what a single increase can mean at home.",
    };
    return {
      draft: readDraft(),
      records: [openRecord(example, "FW-0101", now())],
      reviewDrafts: {},
    };
  }

  function readEvents(value, field) {
    if (!Array.isArray(value)) return [];
    return value
      .filter((row) => typeof row?.[field] === "string" && validTime(row.at))
      .map((row) => ({ at: row.at, [field]: row[field] }));
  }

  function validTime(value) {
    return typeof value === "string" && Number.isFinite(Date.parse(value));
  }

  function restore(raw) {
    const saved = JSON.parse(raw);
    if (saved.version !== 1 || !Array.isArray(saved.records))
      throw new Error("Unknown workspace format.");
    const ids = new Set();
    const records = saved.records.map((row) => {
      if (
        !row ||
        !/^FW-[\w-]+$/.test(row.id) ||
        ids.has(row.id) ||
        !allowedStates.includes(row.status) ||
        !validTime(row.createdAt) ||
        typeof row.original !== "string" ||
        typeof row.copy !== "string"
      ) {
        throw new Error("Unreadable case file.");
      }
      ids.add(row.id);
      return {
        ...readDraft(row),
        revisionId: null,
        id: row.id,
        original: row.original,
        copy: row.copy,
        status: row.status,
        note: string(row.note),
        createdAt: row.createdAt,
        updatedAt: validTime(row.updatedAt) ? row.updatedAt : row.createdAt,
        approvedAt: validTime(row.approvedAt) ? row.approvedAt : null,
        history: readEvents(row.history, "text"),
        log: readEvents(row.log, "text"),
        versions: readEvents(row.versions, "story"),
      };
    });
    const reviewDrafts = {};
    for (const id of ids) {
      if (string(saved.reviewDrafts?.[id]))
        reviewDrafts[id] = saved.reviewDrafts[id];
    }
    const draft = readDraft(saved.draft);
    if (!ids.has(draft.revisionId)) draft.revisionId = null;
    return { draft, records, reviewDrafts };
  }

  let state = initial();
  let lastRaw;
  let persistent = true;
  let warning = "";
  function read() {
    if (!persistent) return state;
    try {
      const raw = globalThis.localStorage.getItem(storageKey);
      if (raw !== lastRaw) {
        if (raw) {
          try {
            state = restore(raw);
          } catch {
            state = initial();
            warning =
              "The saved workspace could not be read. A fresh example is open.";
          }
        } else if (lastRaw !== undefined) {
          state = initial();
        }
        lastRaw = raw;
      }
    } catch {
      useMemory();
    }
    return state;
  }

  function useMemory() {
    persistent = false;
    warning =
      "Browser storage is unavailable. Keep this tab open to keep your work.";
  }

  function commit() {
    if (!persistent) return;
    const serialized = JSON.stringify({ version: 1, ...state });
    try {
      globalThis.localStorage.setItem(storageKey, serialized);
      lastRaw = serialized;
    } catch {
      useMemory();
    }
  }

  function find(id) {
    const record = read().records.find((item) => item.id === id);
    if (!record) throw new Error("This case could not be found.");
    return record;
  }

  function patchDraft(patch) {
    const { draft } = read();

/* The organizer works on a recipient copy. The participant's original stays
   visible during editing, and the model checks permission again at export. */
(() => {
  "use strict";

  const labels = {
    "in-review": "In review",
    "changes-requested": "Changes requested",
    approved: "Approved",
  };
  const filters = { all: "All stories", ...labels };
  let selectedFilter = "all";
  const dateFormat = new Intl.DateTimeFormat("en-US", {
    month: "short",
    day: "numeric",
    year: "numeric",
  });
  const timeFormat = new Intl.DateTimeFormat("en-US", {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });

  const escape = (value) => App.esc(String(value ?? ""));
  const routeTo = (page, id) => "#/" + page + "/" + encodeURIComponent(id);
  const statusMark = (status) =>
    `<span class="desk-state" data-state="${escape(status)}"><i aria-hidden="true"></i>${escape(labels[status] || status)}</span>`;
  const backLink = (href, label) =>
    `<a class="desk-back" href="${href}"><span aria-hidden="true">←</span>${label}</a>`;
  const alertArea =
    '<p class="desk-feedback" role="alert" data-error hidden></p>';

  function warn(host, error) {
    const target = host.querySelector("[data-error]");
    target.hidden = false;
    target.textContent =
      error.message ||
      "This action could not be completed. Reopen the case and try again.";
  }

  function notFound(host, packet = false) {
    host.innerHTML = `<section class="page desk-page"><header class="page-head">
      <p class="eyebrow">Organizer desk</p><h1>${packet ? "Packet unavailable" : "Story unavailable"}</h1>
      <p>This case could not be found in this browser. Open the desk to see the stories available here.</p></header>
      <a class="btn primary" href="#/desk">Open organizer desk</a></section>`;
  }

  function queue(host) {
    const records = Book.get().records;
    const counts = Object.fromEntries(
      Object.keys(filters).map((key) => [
        key,
        key === "all"
          ? records.length
          : records.filter((record) => record.status === key).length,
      ]),
    );
    host.innerHTML = `<section class="page desk-page">
      <header class="page-head desk-head"><p class="eyebrow">Organizer workspace</p>
        <h1>Review desk</h1><p>Check what each resident agreed to share before preparing a story for the city’s energy bill study.</p></header>
      <section class="desk-ledger" aria-label="Submitted stories">
        <div class="desk-filters" role="group" aria-label="Filter stories by review status">
          ${Object.entries(filters)
            .map(
              ([key, label]) =>
                `<button type="button" data-filter="${key}" aria-pressed="${key === selectedFilter}">${label}<span aria-hidden="true">${counts[key]}</span></button>`,
            )
            .join("")}
        </div>
        <p class="desk-sr" aria-live="polite" data-count></p>
        <div data-rows></div>
      </section></section>`;

    function drawRows() {
      const visible = records.filter(
        (item) => selectedFilter === "all" || item.status === selectedFilter,
      );
      host.querySelector("[data-count]").textContent =
        visible.length +
        " " +
        (visible.length === 1 ? "story shown." : "stories shown.");
      const rows = host.querySelector("[data-rows]");
      if (!visible.length) {
        const all = selectedFilter === "all";
        rows.innerHTML = `<div class="desk-empty"><h2>${all ? "The desk is empty" : "No stories in this view"}</h2>
          <p>${all ? "Submit a fictional story to bring it here for review." : "Choose another status or return to all stories."}</p>
          ${all ? '<a class="btn secondary" href="#/write">Write a story</a>' : '<button type="button" class="btn secondary" data-show-all>Show all stories</button>'}</div>`;
        rows.querySelector("[data-show-all]")?.addEventListener("click", () => {
          const allFilter = host.querySelector('[data-filter="all"]');
          allFilter.click();
          allFilter.focus();
        });
        return;
      }
      rows.innerHTML = `<div class="desk-column-labels" aria-hidden="true"><span>Household</span><span>Submitted</span><span>Review status</span><span></span></div>
        <ul class="desk-rows">${visible
          .map(
            (
              item,
            ) => `<li><a class="desk-row" href="${routeTo("review", item.id)}">
          <span class="desk-person"><strong>${escape(item.name)}</strong><span>${escape(item.city)} · ${escape(item.id)}</span></span>
          <time datetime="${escape(item.createdAt)}">${dateFormat.format(new Date(item.createdAt))}</time>
          ${statusMark(item.status)}<span class="desk-row-arrow" aria-hidden="true">↗</span>
          <span class="desk-sr">Open case</span></a></li>`,
          )
          .join("")}</ul>`;
    }
    for (const button of host.querySelectorAll("[data-filter]")) {
      button.addEventListener("click", () => {
        selectedFilter = button.dataset.filter;
        for (const sibling of host.querySelectorAll("[data-filter]")) {
          sibling.setAttribute("aria-pressed", String(sibling === button));
        }
        drawRows();
      });
    }
    drawRows();
  }

  function permissionList(record) {
    const permits = record.privateOK && record.recipientOK;
    const pairs = [
      ["Organizer review", record.privateOK ? "Allowed" : "Withheld"],
      ["Recipient copy", permits ? "Allowed" : "Withheld"],
      ["Participant name", permits && record.nameOK ? "Included" : "Withheld"],
      [
        "Sample bill",
        permits && record.attached && record.docOK ? "Included" : "Excluded",
      ],
      ["Public reuse", record.publicOK ? "Allowed" : "Withheld"],
    ];
    return `<dl class="desk-permissions">${pairs.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join("")}</dl>`;
  }

  function decision(record) {
    if (Book.canExport(record)) {
      return `<a class="btn primary" href="${routeTo("packet", record.id)}">Open approved packet <span aria-hidden="true">→</span></a>`;
    }
    if (record.status === "changes-requested") {
      return `<p class="desk-decision-note">Waiting for a revised story.</p><a class="desk-text-link" href="${routeTo("receipt", record.id)}">Open participant receipt <span aria-hidden="true">↗</span></a>`;
    }
    if (!record.privateOK || !record.recipientOK) {
      return '<p class="desk-decision-note">The participant withheld recipient sharing. This story stays in the review desk.</p>';
    }
    return `<button class="btn primary" type="button" data-approve ${Book.canApprove(record) ? "" : "disabled"}>Approve recipient copy <span aria-hidden="true">→</span></button>
      ${record.copy.trim() ? "" : '<p class="desk-decision-note">Enter a recipient copy before approving.</p>'}`;
  }

  function review(host, id) {
    const record = Book.getRecord(id);
    if (!record) return notFound(host);
    const noteDraft = Book.get().reviewDrafts[id] || "";
    host.innerHTML = `<section class="page desk-page">
      ${backLink("#/desk", "Review desk")}
      <header class="page-head desk-head"><div class="desk-case-meta"><p class="eyebrow">Case ${escape(record.id)}</p><span data-case-status>${statusMark(record.status)}</span></div>
        <h1>${escape(record.name)}</h1><p>${escape(record.city)} · Submitted ${dateFormat.format(new Date(record.createdAt))}</p></header>
      ${alertArea}
      <div class="desk-layout desk-review-layout">
        <article class="desk-section desk-source"><h2>Original story</h2>
          <blockquote>${escape(record.original)}</blockquote>
          ${record.attached ? '<details class="desk-disclosure"><summary>View attached sample bill</summary><pre class="desk-document" data-bill></pre></details>' : ""}
          ${
            record.versions?.length
              ? `<details class="desk-disclosure"><summary>Earlier participant versions</summary>
            ${[...record.versions]
              .reverse()
              .map(
                (version) =>
                  `<div class="desk-version"><time datetime="${escape(version.at)}">${timeFormat.format(new Date(version.at))}</time><p>${escape(version.story)}</p></div>`,
              )
              .join("")}</details>`
              : ""
          }
        </article>
        <aside class="desk-rail" aria-label="Participant permissions">
          <section class="desk-file"><h2>Sharing choices</h2>${permissionList(record)}</section>
          <details class="desk-disclosure desk-history"><summary>Case history</summary><div data-history>${historyList(record)}</div></details>
        </aside>
        <section class="desk-section desk-copy-section"><h2>Recipient copy</h2>
          <p id="desk-copy-help">Remove private details from the text before approval. The original stays on file.</p>
          <label class="desk-sr" for="desk-copy">Edit recipient copy</label>
          <textarea id="desk-copy" class="desk-input" rows="5" aria-describedby="desk-copy-help">${escape(record.copy)}</textarea>
          <button class="desk-restore" type="button" data-restore ${record.copy === record.original ? "hidden" : ""}>Restore original text</button>
          <p class="desk-save" role="status" data-save-copy></p><div data-decision class="desk-decision">${decision(record)}</div>
        </section>
        <section class="desk-section desk-notes-section"><h2>Participant feedback</h2>
          ${record.note ? `<div class="desk-previous-note"><strong>Last request</strong><p>${escape(record.note)}</p></div>` : ""}
          <label for="desk-note">What should the participant change?</label>
          <textarea id="desk-note" class="desk-input" rows="3" aria-describedby="desk-note-help">${escape(noteDraft)}</textarea>
          <p class="desk-note-help" id="desk-note-help">Feedback stays private until you request changes. The participant can then read it on their receipt.</p>
          <p class="desk-feedback" id="desk-note-error" hidden></p>
          <div class="actions"><button type="button" class="btn secondary" data-request>Request changes</button></div>
          <p role="status" class="desk-save" data-feedback-saved></p>
        </section>
      </div></section>`;
    if (record.attached)
      host.querySelector("[data-bill]").textContent = Book.sampleBill;
    const editor = host.querySelector("#desk-copy");
    const note = host.querySelector("#desk-note");
    const saved = host.querySelector("[data-save-copy]");
    const noteError = host.querySelector("#desk-note-error");
    const decisionArea = host.querySelector("[data-decision]");
    const restore = host.querySelector("[data-restore]");

    // The editor stays mounted while the approval controls update so typing
    // preserves the insertion point and immediately withdraws a stale packet.
    function sync(next) {
      host.querySelector("[data-case-status]").innerHTML = statusMark(
        next.status,
      );
      decisionArea.innerHTML = decision(next);
      host.querySelector("[data-history]").innerHTML = historyList(next);
    }
    editor.addEventListener("input", () => {
      try {
        const previous = Book.getRecord(id);
        const next = Book.editCopy(id, editor.value);
        restore.hidden = next.copy === next.original;
        if (
          previous.status !== next.status ||
          Boolean(previous.copy.trim()) !== Boolean(next.copy.trim())
        )
          sync(next);
        const invalidated =
          previous.status === "approved" && next.status !== "approved";
        if (invalidated) saved.dataset.reapproval = "true";
        saved.textContent = saved.dataset.reapproval
          ? "Copy changed. A new approval is required."
          : Book.storageOK()
            ? "Copy saved in this browser."
            : "Copy kept in this tab until it closes.";
      } catch (error) {
        warn(host, error);
      }
    });
    restore.addEventListener("click", () => {
      if (
        !window.confirm(
          "Replace the edited recipient copy with the participant’s original text?",
        )
      )
        return;
      editor.value = Book.getRecord(id).original;
      editor.dispatchEvent(new Event("input"));
      editor.focus();
    });
    decisionArea.addEventListener("click", (event) => {
      if (!event.target.closest("[data-approve]")) return;
      try {
        Book.approve(id);
        App.go("/packet/" + encodeURIComponent(id));
      } catch (error) {
        warn(host, error);
      }
    });
    note.addEventListener("input", () => {
      try {
        Book.saveNote(id, note.value);
        if (note.value.trim()) {
          noteError.hidden = true;
          note.removeAttribute("aria-invalid");
          note.setAttribute("aria-describedby", "desk-note-help");
        }
      } catch (error) {
        warn(host, error);
      }
    });
    host.querySelector("[data-request]").addEventListener("click", () => {
      if (!note.value.trim()) {
        noteError.textContent = "Write a request for the participant first.";
        noteError.hidden = false;
        note.setAttribute("aria-invalid", "true");
        note.setAttribute("aria-describedby", "desk-note-error desk-note-help");
        note.focus();
        return;
      }
      try {
        Book.requestChanges(id, note.value);
        review(host, id);
        const result = host.querySelector("[data-feedback-saved]");
        result.textContent =
          "Changes requested. The feedback is on the participant’s receipt.";
        const receipt =
          host.querySelector("[data-decision] a") ||
          host.querySelector("[data-request]");
        receipt.focus();
      } catch (error) {
        warn(host, error);
      }
    });
  }

  function historyList(record) {
    const entries = [...record.history].reverse();
    if (!entries.length) return "<p>No changes recorded yet.</p>";
    return `<ol class="desk-events">${entries
      .map(
        (entry) => `<li><span>${escape(entry.text)}</span>
      <time datetime="${escape(entry.at)}">${timeFormat.format(new Date(entry.at))}</time></li>`,
      )
      .join("")}</ol>`;
  }

  function deliveryLog(record) {
    if (!record.log.length)
      return '<p class="desk-log-note">No simulation recorded.</p>';
    return `<ol class="desk-events">${record.log
      .map(
        (entry) => `<li>${escape(entry.text)}
      <time datetime="${escape(entry.at)}">${timeFormat.format(new Date(entry.at))}</time></li>`,
      )
      .join("")}</ol>`;
  }

  function packet(host, id) {
    const record = Book.getRecord(id);
    if (!record) return notFound(host, true);
    const back = backLink(routeTo("review", id), "Case review");
    if (!Book.canExport(record)) {
      host.innerHTML = `<section class="page desk-page">${back}<header class="page-head"><p class="eyebrow">Case ${escape(id)}</p>
        <h1>Packet unavailable</h1><p>The current copy needs recipient permission and organizer approval before it can be downloaded.</p></header>
        <a class="btn primary" href="${routeTo("review", id)}">Review this case</a></section>`;
      return;
    }
    host.innerHTML = `<section class="page desk-page">${back}
      <header class="page-head desk-head"><div class="desk-case-meta"><p class="eyebrow">Case ${escape(id)}</p>${statusMark(record.status)}</div>
        <h1>Recipient packet</h1><p>Download the approved text and the details this participant agreed to share.</p></header>
      ${alertArea}
      <div class="desk-layout desk-packet-layout"><div class="desk-content">
        <div class="desk-packet-tools"><button type="button" class="btn primary" data-download>Download packet <span aria-hidden="true">↓</span></button>
          <span>Plain text · .txt</span></div>
        <p role="status" class="desk-save" data-downloaded></p>
        <section class="desk-paper"><h2>Packet contents</h2><pre class="desk-document" data-preview></pre></section>
      </div><div class="desk-rail">
        <section class="desk-file" aria-labelledby="desk-rehearsal"><h2 id="desk-rehearsal">Delivery rehearsal</h2>
          <p>This records a trial delivery in your browser. Nothing is sent to a recipient.</p>
          <button type="button" class="btn secondary" data-simulate ${record.log.length ? "disabled" : ""}>${record.log.length ? "Simulation recorded" : "Simulate delivery"}</button>
          <div data-log class="desk-log" aria-live="polite">${deliveryLog(record)}</div>
        </section></div></div></section>`;
    // Display the exact bytes used for the download. The packet formatter is
    // the single place that decides which fields may leave the review desk.
    const preview = host.querySelector("[data-preview]");
    preview.textContent = Book.packet(id);
    host.querySelector("[data-download]").addEventListener("click", () => {
      try {
        const current = Book.packet(id);
        if (current !== preview.textContent) {
          packet(host, id);
          host.querySelector("[data-downloaded]").textContent =
            "The approved packet changed. Read the updated contents before downloading.";
          return;
        }
        App.download(current, "household-record-" + id + ".txt");
        host.querySelector("[data-downloaded]").textContent =
          "Text file prepared for download.";
      } catch (error) {
        warn(host, error);
      }
    });
    const simulate = host.querySelector("[data-simulate]");
    simulate.addEventListener("click", () => {
      try {
        const next = Book.simulate(id);
        simulate.textContent = "Simulation recorded";
        simulate.disabled = true;
        host.querySelector("[data-log]").innerHTML = deliveryLog(next);
      } catch (error) {
        warn(host, error);
      }
    });
  }

  window.Desk = {
    render(host, route) {
      const [, page, id] = route.split("/");
      if (page === "desk") return queue(host);
      return page === "review" ? review(host, id) : packet(host, id);
    },
  };
})();

/* Three views of one fictional case. The exhibit never reads the visitor's drafts. */
(() => {
  "use strict";
  const views = ["Bill", "Story", "Sharing"];
  const story =
    "When the next bill came in at $286, we split our grocery trip across two weeks.";
  const caseFile = "FW-0101";
  let sequence = 0;

  function choices() {
    return '<dl class="fx-permissions"><div><dt>Recipient copy</dt><dd>Allowed</dd></div><div><dt>Contributor name</dt><dd>Withheld</dd></div><div><dt>Sample bill</dt><dd>Excluded</dd></div></dl>';
  }

  function drawing(view) {
    const header = [
      "Monthly charges",
      "Participant account",
      "Release schedule",
    ][view];
    const detail = [
      '<div class="fx-plot"><div class="fx-axis"><span>$300</span><span>$150</span><span>$0</span></div>' +
        '<div class="fx-columns"><div class="fx-column fx-previous"><strong>$178</strong><i></i><small>Previous</small></div>' +
        '<div class="fx-column fx-current"><strong>$286</strong><i></i><small>Current</small></div></div></div>',
      '<div class="fx-measured-text"><span class="fx-tinytag">Source / participant</span><blockquote>“' +
        story +
        "”</blockquote></div>",
      '<div class="fx-register"><span class="fx-tinytag">Recipient packet</span>' +
        choices() +
        "</div>",
    ][view];
    const footer = [
      "<span>Change</span><strong>+$108</strong>",
      "<span>Community</span><strong>Reading, PA</strong>",
      "<span>Public reuse</span><strong>Withheld</strong>",
    ][view];
    return (
      '<div class="fx-art fx-drawing"><div class="fx-plan"><div class="fx-plan-head"><span class="fx-tinytag">Sample case / ' +
      caseFile +
      "</span><h3>" +
      header +
      "</h3></div>" +
      detail +
      '<div class="fx-plan-key">' +
      footer +
      "</div></div></div>"
    );
  }

  function journal(view) {
    const detail = [
      '<h3>The monthly bill</h3><p class="fx-note-sum">$178 <span>→</span> $286</p><p class="fx-note-line">A $108 increase in one month.</p>',
      '<h3>In their words</h3><blockquote class="fx-excerpt">“' +
        story +
        "”</blockquote>",
      "<h3>What may travel</h3>" + choices(),
    ][view];
    return (
      '<div class="fx-art fx-garden"><div class="fx-aerial" aria-hidden="true"></div><article class="fx-fieldnote">' +
      '<div class="fx-reference"><span>Household notes</span><span>' +
      caseFile +
      "</span></div>" +
      detail +
      "</article></div>"
    );
  }

  function envelope(view) {
    const detail = [
      "<h3>A change<br>of <em>$108.</em></h3><p>$178 last month · $286 this month</p>",
      "<h3>Dear review team,</h3><blockquote>“" + story + "”</blockquote>",
      "<h3>Enclosure list</h3>" + choices(),
    ][view];
    return (
      '<div class="fx-art fx-post fx-post-' +
      view +
      '"><div class="fx-envelope">' +
      '<div class="fx-back" aria-hidden="true"></div><div class="fx-letter"><div class="fx-reference">Sample correspondence</div>' +
      detail +
      '</div><div class="fx-pocket" aria-hidden="true"><i></i></div><div class="fx-address"><span>Household correspondence</span><b>' +
      caseFile +
      '</b></div><div class="fx-postage" aria-hidden="true"><i></i></div></div></div>'
    );
  }

  const renderers = {
    blueprint: drawing,
    garden: journal,
    parade: envelope,
  };

  function render(host, edition) {
    const draw = renderers[edition] || drawing;
    const id = "field-exhibit-" + ++sequence;
    const tab = (label, index) =>
      '<button type="button" role="tab" id="' +
      id +
      "-tab-" +
      index +
      '" aria-controls="' +
      id +
      "-panel-" +
      index +
      '" aria-selected="' +
      (index === 0) +
      '" tabindex="' +
      (index === 0 ? "0" : "-1") +
      '">' +
      label +
      "</button>";
    const panel = (_, index) =>
      '<div role="tabpanel" class="fx-panel" tabindex="0" id="' +
      id +
      "-panel-" +
      index +
      '" aria-labelledby="' +
      id +
      "-tab-" +
      index +
      '"' +
      (index ? " hidden" : "") +
      ">" +
      draw(index) +
      "</div>";
    host.innerHTML =
      '<div class="fx"><div class="fx-top"><h2 class="fx-label">Sample exhibit</h2>' +
      '<div class="fx-tabs" role="tablist" aria-label="Sample exhibit">' +
      views.map(tab).join("") +
      "</div></div>" +
      views.map(panel).join("") +
      "</div>";
    const tabs = [...host.querySelectorAll("[role=tab]")];
    const panels = [...host.querySelectorAll("[role=tabpanel]")];
    function select(index) {
      tabs.forEach((button, i) => {
        const active = i === index;
        button.setAttribute("aria-selected", String(active));
        button.tabIndex = active ? 0 : -1;
        panels[i].hidden = !active;
      });
    }
    tabs.forEach((button, index) => {
      button.addEventListener("click", () => select(index));
      button.addEventListener("keydown", (event) => {
        const destinations = {
          ArrowRight: (index + 1) % tabs.length,
          ArrowLeft: (index + tabs.length - 1) % tabs.length,
          Home: 0,
          End: tabs.length - 1,
        };
        if (!(event.key in destinations)) return;
        event.preventDefault();
        const next = destinations[event.key];
        select(next);
        tabs[next].focus();
      });
    });
  }

  globalThis.Exhibit = Object.freeze({ render });
})();
